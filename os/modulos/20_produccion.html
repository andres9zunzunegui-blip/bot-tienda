<style>
/* ============ Estudio de producción de la serie animada (agente 2 · .pr-) ============ */
.pr-prod{display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--oro);padding-top:18px;scroll-margin-top:12px}
.pr-cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));align-items:start}
.pr-sh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.pr-step{border-top:1px solid var(--line);padding:10px 0 4px;display:flex;flex-direction:column;gap:8px}
.pr-step:first-of-type{border-top:0;padding-top:0}
.pr-step b{font-size:14px}
.pr-n{font:500 12px var(--f-mono);color:var(--oro-ink);margin-right:6px}
.pr-sub{font-size:12px;color:var(--muted);font-weight:500}
.pr-step select{width:auto;max-width:150px;padding:6px 8px;font-size:13px}
.pr-sx{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px}
.pr-sx input{padding:7px 9px;font-size:13.5px}
.pr-art{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.pr-two{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.pr-chips{display:flex;flex-wrap:wrap;gap:5px}
.pr-chips .chip{white-space:normal}
.pr-chk{flex-direction:row!important;align-items:center;gap:8px!important;font-weight:600!important;color:var(--ink)!important;font-size:13px!important}
.pr-chk input{width:auto;flex:none}
.pr-diff{font-family:var(--f-display);font-size:17px;line-height:1.65;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.pr-diff del{color:var(--bad);text-decoration:line-through;background:color-mix(in srgb,var(--bad) 9%,transparent);border-radius:3px;padding:0 2px}
.pr-diff ins{text-decoration:none;color:var(--bad);font-weight:700;background:color-mix(in srgb,var(--bad) 20%,transparent);border-radius:3px;padding:0 2px}
.pr-seg{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pr-seg:first-child{border-top:0;padding-top:0}
.pr-cmd{font:500 12.5px var(--f-mono);background:var(--soft);color:var(--ink);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.pr-eps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.pr-ep{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.pr-ep.pr-next{border-color:var(--oro);box-shadow:inset 3px 0 0 var(--oro)}
.pr-ep b.pr-t{font-weight:700;overflow-wrap:anywhere}
.pr-bar{display:flex;gap:3px}
.pr-bar i{flex:1;height:7px;border-radius:99px;background:var(--soft);display:block}
.pr-bar i.on{background:var(--ok)}.pr-bar i.now{background:var(--oro)}.pr-bar i.blk{background:var(--bad)}.pr-bar i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pr-cast{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pr-ok{color:var(--ok);font-weight:700}
@media (max-width:600px){.pr-sx{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pr-sx .pr-nota{grid-column:1/-1}.pr-two{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
"use strict";
/* ============ Estudio de producción de la serie animada (agente 2 · prefijo pr_) ============ */
const PR_PASOS=[["verificacion","0","Verificación jurídica","Texto vigente en InfoLEG o SAIJ, concordancias y excepciones"],["planos","1","Planos clave en Floot","Con las imágenes base del elenco"],["veo","2","Animación con Veo","Opcional"],["voces","3","Voces","2 tomas por línea, verificadas con el transcriptor"],["render","5","Composición y render","1080x1920, de 45 a 60 s"],["contacto","6","Hoja de contacto","Revisión cuadro por cuadro"],["descripcion","7","Descripción y primer comentario","Con las fuentes"]];
const PR_EST=[["pendiente","Pendiente"],["curso","En curso"],["hecho","Hecho"],["bloqueado","Bloqueado"],["na","No aplica"]];
const PR_PLAN=[{slug:"957_1015",arts:"957 y 1015",clausulo:"anteojos"},{slug:"959",arts:"959",clausulo:"lentes oscuros"},{slug:"985",arts:"985",clausulo:"anteojos"},{slug:"988",arts:"988",clausulo:"anteojos"},{slug:"984",arts:"984",clausulo:"lentes oscuros"},{slug:"1061",arts:"1061",clausulo:"anteojos"},{slug:"1088",arts:"1088",clausulo:"lentes oscuros"},{slug:"332",arts:"332",clausulo:"anteojos"}];
const PR_VAR=[["anteojos","Anteojos dorados"],["lentes oscuros","Lentes oscuros"]];
const PR_DISC="Contenido informativo: no reemplaza el asesoramiento de un abogado matriculado.";
const PR_INFOLEG="http://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/235975/norma.htm";
const PR_LEY_RE=/^\s*[\[(]?\s*(?:la\s+)?voz\s+de\s+la\s+ley\s*[\])]?\s*[:：—–-]\s*([\s\S]+)$/i;
S.pr_plan=[];const pr_draft={};let pr_t=0;

/* ---------- utilidades ---------- */
const pr_norm=s=>String(s??"").normalize("NFC").replace(/[\s  -​  　]+/g," ").trim();
const pr_toks=s=>pr_norm(s).split(" ").filter(Boolean);
const pr_unq=s=>String(s).replace(/^[\s«"“'‘]+/,"").replace(/[\s»"”'’]+$/,"");
const pr_nums=s=>(String(s||"").match(/\d+/g)||[]).map(Number);
const pr_key=s=>[...new Set(pr_nums(s))].sort((a,b)=>a-b).join("_");
function pr_expand(s){const out=[];String(s||"").replace(/(\d+)\s*(?:a|al|-|–)\s*(\d+)|(\d+)/g,(m,a,b,c)=>{if(c)out.push(+c);else{a=+a;b=+b;if(b>a&&b-a<=12)for(let i=a;i<=b;i++)out.push(i);else out.push(a,b)}return m});return[...new Set(out)]}
const pr_paso=(r,k)=>(r.pr_pasos&&r.pr_pasos[k])||{};
const pr_est=(r,k)=>pr_paso(r,k).estado||"pendiente";
function pr_ef(r,k){const e=pr_est(r,k);if(e==="pendiente"&&k==="render"&&r.video&&r.video.url)return"hecho";if(e==="pendiente"&&k==="veo")return"opc";return e}
function pr_actual(r){const p=PR_PASOS.find(([k])=>!["hecho","na","opc"].includes(pr_ef(r,k)));return p||null}
const pr_slugOf=r=>pr_norm(r.pr_slug)||pr_key(r.articulos);
function pr_t1(arts){const ns=pr_nums(arts);return(typeof T1!=="undefined"?T1:[]).find(([,a])=>pr_expand(a).some(n=>ns.includes(n)))||null}
const pr_planAll=()=>{const seen=new Set(PR_PLAN.map(p=>p.slug));return[...PR_PLAN,...S.pr_plan.filter(p=>p&&p.slug&&!seen.has(p.slug)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(p=>({...p,custom:true}))]};
function pr_reelDe(p){const rs=S.reels||[];return rs.find(r=>pr_norm(r.pr_slug)===p.slug)||rs.find(r=>!pr_norm(r.pr_slug)&&r.articulos&&pr_key(r.articulos)===p.slug)||null}
const pr_chips=list=>list.map(([k,t])=>`<span class="chip ${k}">${esc(t)}</span>`).join("");

/* ---------- La Voz de la ley contra el texto literal ---------- */
function pr_leySegs(r){const segs=[];
  const fromText=(t,where)=>String(t||"").split(/\n/).forEach(l=>{const m=l.match(PR_LEY_RE);if(m&&m[1].trim())segs.push({txt:pr_unq(m[1].trim()),where})});
  (r.bloques||[]).forEach((b,i)=>{const w=`Bloque ${i+1}${b.tiempo?" ("+b.tiempo+")":""}`;const v=String(b.voz||"").trim();
    if(b.pr_ley){if(v){const m=v.match(PR_LEY_RE);segs.push({txt:pr_unq(m?m[1]:v),where:w})}}else fromText(v,w)});
  ["guionTexto","guion"].forEach(f=>{if(typeof r[f]==="string")fromText(r[f],"Guion")});
  if(Array.isArray(r.escenas))r.escenas.forEach((e,i)=>{if(!e||typeof e!=="object")return;const quien=String(e.personaje||e.quien||"");const t=e.texto||e.linea||e.voz||e.dialogo||"";
    if(typeof t!=="string")return;if(/voz\s+de\s+la\s+ley/i.test(quien)&&t.trim())segs.push({txt:pr_unq(t.trim()),where:"Escena "+(i+1)});else fromText(t,"Escena "+(i+1))});
  return segs.filter(s=>pr_norm(s.txt))}
function pr_align(a,b){const m=a.length,n=b.length;const D=[];for(let i=0;i<=m;i++){const row=new Uint16Array(n+1);row[0]=i;D.push(row)}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j-1]+(a[i-1]===b[j-1]?0:1),D[i-1][j]+1,D[i][j-1]+1);
  let bj=0;for(let j=1;j<=n;j++)if(D[m][j]<D[m][bj])bj=j;
  const ops=[];let i=m,j=bj;
  while(i>0){if(j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ops.push(a[i-1]===b[j-1]?["eq",a[i-1]]:["sub",b[j-1],a[i-1]]);i--;j--}
    else if(D[i][j]===D[i-1][j]+1){ops.push(["ins",a[i-1]]);i--}else{ops.push(["del",b[j-1]]);j--}}
  ops.reverse();return{cost:D[m][bj],ops,start:j,end:bj,n}}
function pr_check(r){const arts=(r.pr_articulos||[]).filter(a=>pr_norm(a.texto));const segs=pr_leySegs(r);
  const out=segs.map(s=>{const a=pr_toks(s.txt);let best=null;
    arts.forEach(art=>{const base=pr_toks(art.texto);const cands=[base];
      if(/^art/i.test(a[0]||"")){const ep=pr_norm(art.epigrafe);cands.push([...pr_toks(`Artículo ${pr_norm(art.num)}.${ep?" "+ep.replace(/\.?$/,"."):""}`),...base])}
      cands.forEach(b=>{const al=pr_align(a,b);if(!best||al.cost<best.cost)best={...al,art,b}})});
    const warns=[];if(best&&best.cost===0){const b=best.b;
      if(best.start>0&&!/[.:;]$/.test(b[best.start-1]))warns.push("Empieza a mitad de oración: revisá que no falte el comienzo.");
      if(best.end<b.length&&!/[.:;]$/.test(b[best.end-1]))warns.push("Corta a mitad de oración: revisá que no falte el final.")}
    return{...s,len:a.length,best,warns,ok:!!best&&best.cost===0,lejos:!!best&&best.cost>Math.max(3,a.length*.5)}});
  const diffs=out.reduce((t,s)=>t+(s.best?s.best.cost:0),0);
  return{segs:out,arts,diffs,ok:out.length>0&&arts.length>0&&out.every(s=>s.ok)}}
function pr_cambios(ops){const out=[];let cur=null;const flush=()=>{if(cur){out.push(cur);cur=null}};
  ops.forEach(o=>{if(o[0]==="eq"){flush();return}cur=cur||{lit:[],gui:[]};if(o[0]==="sub"){cur.lit.push(o[1]);cur.gui.push(o[2])}else if(o[0]==="del")cur.lit.push(o[1]);else cur.gui.push(o[1])});flush();
  return out.map(c=>c.lit.length&&c.gui.length?`Cambia «${c.lit.join(" ")}» por «${c.gui.join(" ")}»`:c.lit.length?`Falta «${c.lit.join(" ")}»`:`Sobra «${c.gui.join(" ")}»`)}
function pr_diffHtml(ops){return ops.map(o=>o[0]==="eq"?esc(o[1]):o[0]==="sub"?`<del>${esc(o[1])}</del> <ins>${esc(o[2])}</ins>`:o[0]==="del"?`<del>${esc(o[1])}</del>`:`<ins>${esc(o[1])}</ins>`).join(" ")}
function pr_matchInner(r){const m=pr_check(r);const bl=r.bloques||[];
  const head=!m.segs.length?`<div class="pr-chips"><span class="chip warn">No encontré líneas de la Voz de la ley en el guion</span></div><p class="small muted" style="margin:0">Escribilas en la voz en off empezando con “Voz de la ley:”, o marcá abajo los bloques que lee la Voz de la ley.</p>`
    :!m.arts.length?`<div class="pr-chips"><span class="chip warn">Hay ${m.segs.length} ${m.segs.length===1?"línea":"líneas"} de la Voz de la ley, pero falta pegar el texto literal del artículo</span></div>`
    :`<div class="pr-chips">${m.ok?`<span class="chip ok">Coincide palabra por palabra con el texto literal</span>`:`<span class="chip bad">${m.diffs} ${m.diffs===1?"diferencia":"diferencias"} con el texto literal: corregí el guion, no el artículo</span>`}</div>`;
  const segs=m.arts.length?m.segs.map(s=>{const b=s.best;if(!b)return"";const ch=pr_cambios(b.ops);
    return `<div class="pr-seg"><div class="pr-sh"><span class="small"><b>${esc(s.where)}</b> · contra el art. ${esc(pr_norm(b.art.num)||"?")}</span>${s.ok?`<span class="chip ok">Literal</span>`:`<span class="chip bad">${b.cost} ${b.cost===1?"diferencia":"diferencias"}</span>`}</div>
    ${s.lejos?`<span class="small" style="color:var(--bad)">No se parece a ningún artículo cargado: ¿pegaste el artículo correcto?</span>`:""}
    <div class="pr-diff">${pr_diffHtml(b.ops)}</div>
    ${ch.length?`<ul class="small" style="margin:0;padding-left:18px;color:var(--bad)">${ch.slice(0,8).map(c=>`<li>${esc(c)}</li>`).join("")}${ch.length>8?`<li>y ${ch.length-8} más</li>`:""}</ul>`:""}
    ${s.warns.map(w=>`<span class="chip warn" style="white-space:normal;align-self:flex-start">${esc(w)}</span>`).join("")}</div>`}).join(""):"";
  return `<div class="ph"><h3>La Voz de la ley contra el texto literal</h3><span class="small muted">Se ignoran solo los espacios</span></div>${head}
  ${m.segs.length&&m.arts.length?`<span class="small muted">Tachado: lo que dice el artículo. Resaltado en rojo: lo que dice el guion.</span>`:""}${segs}
  ${bl.length?`<details${bl.some(b=>b.pr_ley)?" open":""}><summary>Bloques que lee la Voz de la ley (${bl.filter(b=>b.pr_ley).length})</summary><div style="display:flex;flex-direction:column;gap:6px;padding-top:8px">${bl.map((b,i)=>`<label class="pr-chk"><input type="checkbox" data-prley="${i}" ${b.pr_ley?"checked":""}><span>Bloque ${i+1}${b.tiempo?" ("+esc(b.tiempo)+")":""}: <span class="muted" style="font-weight:500">${esc(String(b.voz||"sin voz").slice(0,70))}${String(b.voz||"").length>70?"…":""}</span></span></label>`).join("")}</div></details>`:""}`}

/* ---------- Descripción y primer comentario (reglas fijas, sin IA) ---------- */
const pr_lit=t=>String(t||"").replace(/[ \t ]+/g," ").replace(/\s*\n\s*/g,"\n").trim();
function pr_genCap(r){const arts=(r.pr_articulos||[]).filter(a=>pr_norm(a.texto));const parts=[];
  const h=String(r.pr_historia||"").trim()||String(r.gancho||"").trim();if(h)parts.push(h);
  if(arts.length)parts.push(`${arts.length>1?"Lo que dicen los artículos":"Lo que dice el artículo"} del Código Civil y Comercial:\n\n`+arts.map(a=>`Artículo ${pr_norm(a.num)}${pr_norm(a.epigrafe)?". "+pr_norm(a.epigrafe).replace(/\.$/,""):""}\n“${pr_lit(a.texto)}”`).join("\n\n"));
  if(r.pr_datoOk&&pr_norm(r.pr_dato))parts.push("Dato extra: "+pr_norm(r.pr_dato));
  if(pr_norm(r.cta))parts.push(pr_norm(r.cta));
  parts.push(PR_DISC);return parts.join("\n\n")}
function pr_genFc(r){const arts=(r.pr_articulos||[]).filter(a=>pr_norm(a.num));const L=["Fuentes:"];
  arts.forEach(a=>L.push(`• Art. ${pr_norm(a.num)} del Código Civil y Comercial de la Nación (Ley 26.994)${pr_norm(a.fuente)?": "+pr_norm(a.fuente):""}${a.verificado?` · texto vigente verificado el ${dia(a.verificado)}`:""}`));
  if(pr_norm(r.pr_concordancias))L.push("Concordancias: "+pr_norm(r.pr_concordancias));
  if(pr_norm(r.pr_excepciones))L.push("Excepciones: "+pr_norm(r.pr_excepciones));
  if(r.pr_datoOk&&pr_norm(r.pr_dato)&&pr_norm(r.pr_datoFuente))L.push("Dato extra: "+pr_norm(r.pr_datoFuente));
  return L.join("\n")}
const pr_titulo=v=>/\bdra?\.|\bdoctora?\b|matr[ií]cul/i.test(String(v||"").split(PR_DISC).join(" "));
function pr_capChecks(r,cap){const w=[];const tot=cap.length+(pr_norm(r.hashtags)?2+String(r.hashtags).length:0);
  if(!pr_norm(cap))return[["warn","Todavía no hay descripción. Tocá “Generar”."]];
  if(tot>2200)w.push(["bad",`${tot} caracteres con los hashtags: Instagram permite hasta 2.200.`]);
  if(pr_titulo(cap))w.push(["bad","Menciona “Dr.”, “Doctor” o una matrícula: no corresponde."]);
  if(!pr_norm(cap).endsWith(PR_DISC))w.push(["bad","Tiene que terminar con: "+PR_DISC]);
  (r.pr_articulos||[]).filter(a=>pr_norm(a.num)||pr_norm(a.texto)).forEach(a=>{if(!pr_norm(a.texto))w.push(["bad",`El art. ${pr_norm(a.num)||"?"} no tiene texto literal cargado.`]);else if(!pr_norm(cap).includes(pr_norm(a.texto)))w.push(["bad",`El texto del art. ${pr_norm(a.num)||"?"} no está igual al literal.`])});
  if(!(r.pr_articulos||[]).some(a=>pr_norm(a.texto)))w.push(["warn","No hay artículos literales cargados."]);
  return w}
function pr_fcChecks(r,fc){const w=[];if(!pr_norm(fc))return[["warn","Todavía no hay primer comentario."]];
  if(fc.length>2200)w.push(["bad",`${fc.length} caracteres: Instagram permite hasta 2.200.`]);
  if(pr_titulo(fc))w.push(["bad","Menciona “Dr.”, “Doctor” o una matrícula: no corresponde."]);
  (r.pr_articulos||[]).filter(a=>pr_norm(a.num)).forEach(a=>{if(!pr_norm(a.fuente))w.push(["warn",`Falta la fuente del art. ${pr_norm(a.num)}.`])});
  return w}
function pr_chkHtml(list,n,extra){return `<div class="pr-chips" aria-live="polite"><span class="small muted" style="width:100%">${n} / 2.200 caracteres${extra||""}</span>${list.length?pr_chips(list):`<span class="chip ok">Sin problemas</span>`}</div>`}
const pr_capBox=(r,cap)=>pr_chkHtml(pr_capChecks(r,cap),cap.length+(pr_norm(r.hashtags)?2+String(r.hashtags).length:0),pr_norm(r.hashtags)?" (con los hashtags)":"");
const pr_fcBox=(r,fc)=>pr_chkHtml(pr_fcChecks(r,fc),fc.length);

/* ---------- Sección "Producción" dentro del editor de reel ---------- */
function pr_artWarns(a){const w=[];if(!pr_norm(a.texto))w.push(["bad","Falta el texto literal"]);else if(/^art[ií]culo\s+\d/i.test(pr_norm(a.texto)))w.push(["warn","Pegá solo el texto: número y epígrafe van en sus campos"]);
  if(!pr_norm(a.fuente))w.push(["warn","Sin fuente"]);else if(!/infoleg|saij/i.test(a.fuente))w.push(["warn","La fuente no es InfoLEG ni SAIJ"]);
  if(!a.verificado)w.push(["warn","Sin fecha de verificación"]);else if(Date.now()-Date.parse(a.verificado+"T12:00:00-03:00")>180*864e5)w.push(["warn","Verificado hace más de 6 meses: revisá que siga vigente"]);
  return w}
function pr_section(r){const pas=r.pr_pasos||{};const arts=r.pr_articulos||[];const slug=pr_slugOf(r);const done=PR_PASOS.filter(([k])=>["hecho","na"].includes(pr_ef(r,k))).length;
  const plan=pr_planAll().find(p=>p.slug===slug);const variante=r.pr_clausulo||(plan&&plan.clausulo)||"";
  const cap=pr_draft[r.id]?pr_draft[r.id].cap:(r.caption||"");const fc=pr_draft[r.id]?pr_draft[r.id].fc:(r.primerComentario||"");
  const fromField=pr_expand(r.articulos).filter(n=>!arts.some(a=>pr_nums(a.num)[0]===n));
  return `<section class="pr-prod" id="pr-prod" aria-label="Producción">
  <div class="pr-sh"><div><div class="eyebrow">Estudio de producción · Serie animada</div><h2>Producción</h2></div><button class="btn primary" data-pract="save">Guardar</button></div>
  <div class="fields"><label for="pr-slug">Slug del episodio<input id="pr-slug" data-prp="pr_slug" value="${esc(r.pr_slug||"")}" placeholder="${esc(pr_key(r.articulos)||"Ej.: 959")}"></label>
   <label for="pr-var">Clausulo en este episodio<select id="pr-var" data-prp="pr_clausulo"><option value="">${plan?"Según el plan: "+esc(plan.clausulo):"Elegí"}</option>${opts(PR_VAR,r.pr_clausulo||"")}</select></label></div>
  <div class="pr-sh"><span class="small">Comando: <code class="pr-cmd" id="pr-cmd">./producir.sh ${esc(slug||"<slug>")}</code>${variante?` · Clausulo con ${esc(variante)}`:""}</span><button class="btn sm" data-pract="cmdReel">Copiar comando</button></div>
  <div class="pr-cols">
