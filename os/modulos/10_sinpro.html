<style>
/* ============ Modo sin Pro (agente 1 · prefijo sp) ============ */
.sp-alt{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sp-alt .sp-k{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-tag{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--oro-ink);text-transform:uppercase}
.sp-note{font-size:12.5px;color:var(--muted);margin:0}
.sp-modo{gap:10px}
.sp-modo .sp-chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.sp-modo .sp-chips .chip{white-space:normal}
.sp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

@media (max-width:860px){.sp-alt .btns .btn{flex:1 1 auto}}
</style>
<script>
"use strict";
/* ============ Modo sin Pro: motor local de plantillas y reglas (sin Claude ni Metricool) ============ */
const SP_WA="2920 60-2681";
const SP_DISC="Contenido informativo: no reemplaza el asesoramiento de un abogado matriculado.";
const SP_TAGS="#ClausulaLegal #CodigoCivil #Contratos #DerechoArgentino #Alquileres";
const SP_KW={"1":"BUENAFE","2":"ABUSO","3":"ADHESION","4":"ERROR","5":"DOLO","6":"LESION","7":"FIRMA","8":"LETRACHICA","9":"SEÑA","10":"RESOLUCION"};
const sp_ai=()=>!!sample&&S.caps.sample==="ok";
const sp_off=()=>S.caps.sample==="off";
const sp_norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const sp_seed=()=>Number(todayAR().replace(/-/g,""))||0;
const sp_rot=(list,n)=>list.length?list.map((_,i)=>list[(i+n)%list.length]):[];
function sp_pilares(){return String(pilot().pilares||"").split(/\n+/).map(s=>s.trim()).filter(Boolean)}
function sp_kwFrom(t){const w=sp_norm(t).replace(/[^a-z\s]/g," ").split(/\s+/).filter(x=>x.length>4&&!/^(sobre|antes|despues|cuando|donde|tengo|puedo|pueden|meses|contrato)$/.test(x)).sort((a,b)=>b.length-a.length)[0];return (w||"contrato").slice(0,12).toUpperCase()}
function sp_caption(gancho,cuerpo,kw){return [gancho,cuerpo,"Guardalo y mandáselo a quien esté por firmar un contrato.",`Comentá ${kw} si querés que lo profundice.`,SP_DISC].filter(Boolean).join("\n\n")}
const sp_hasPh=s=>/\[[^\]]+\]/.test(String(s||""));

/* ---------- (b) Guion de reel por bloques ---------- */
function sp_reel(fmt,ep,tema){const e=T1.find(x=>x[0]===String(ep||""));const arts=e?e[1]:"";const artTxt=arts?"art. "+arts:"[número de artículo]";
  const titulo=e?`Ep. ${e[0]} · ${e[2]}`:(tema||"Reel");
  const gancho=e?e[2]:(tema?(/\?$/.test(tema)?tema:"¿"+tema.replace(/^¿/,"")+"?"):"[Pregunta que la persona reconoce como propia]");
  const kw=e?SP_KW[e[0]]:sp_kwFrom(tema);const cta="Mandáselo a quien esté por firmar un contrato.";
  const ley=(pantalla)=>({tiempo:"",pantalla,voz:"",sp_ley:true});
  let bloques=[],musica="Música instrumental suave, sin letra, por debajo de la voz";
  if(fmt==="personajes"){musica="Sonido original suave; bajarlo cuando habla La Voz de la ley";
    bloques=[{tiempo:"0-3 s",pantalla:`Escritorio de madera con lámpara de bronce. Texto grande: “${gancho}”`,voz:gancho},
      {tiempo:"3-8 s",pantalla:`Codiguito se abre: las páginas pasan solas y se detienen en el ${artTxt}.`,voz:`Código Civil y Comercial, ${artTxt}.`},
      {tiempo:"8-30 s",pantalla:"Inciso y Clausulo actúan el conflicto: [describí la situación cotidiana en 2 o 3 acciones].",voz:"[Diálogo breve entre Inciso y Clausulo: el problema contado como le pasa a cualquiera.]"},
      {...ley(`La Voz de la ley lee el ${artTxt}. En pantalla, el texto literal con subtítulos palabra por palabra.`),tiempo:"30-48 s"},
      {tiempo:"48-55 s",pantalla:"Resaltato subraya en amarillo la frase clave del artículo.",voz:"[Una frase de Clausulo que lo baja a tierra, sin consejo para un caso concreto.]"},
      {tiempo:"55-60 s",pantalla:"Resaltato a cámara: “¡Queda resaltado!”. El último cuadro empalma con el primero (loop).",voz:"¡Queda resaltado! "+cta}]}
  else if(fmt==="resaltador"){bloques=[{tiempo:"0-3 s",pantalla:`Plano cenital: la mano sobre un contrato impreso. Texto: “${gancho}”`,voz:gancho},
      {tiempo:"3-12 s",pantalla:"La mano recorre el contrato y se detiene en una cláusula.",voz:"[Contá en una frase qué cláusula es y por qué conviene leerla.]"},
      {tiempo:"12-25 s",pantalla:"El resaltador amarillo marca la cláusula trampa, palabra por palabra.",voz:"[Explicá qué dice la cláusula y cuál es el riesgo, sin nombrar casos reales.]"},
      {...ley(`Lectura del ${artTxt}: el texto literal aparece sobreimpreso.`),tiempo:"25-42 s"},
      {tiempo:"42-52 s",pantalla:"La mano escribe al margen qué revisar.",voz:"[Qué mirar en tu contrato: 1 a 3 puntos.]"},
      {tiempo:"52-58 s",pantalla:"Texto: ¡Queda resaltado! · Mandáselo a quien vaya a firmar.",voz:"¡Queda resaltado! "+cta}]}
  else if(fmt==="respondo"){bloques=[{tiempo:"0-3 s",pantalla:`Captura de la pregunta del seguidor (sin datos personales): “${gancho}”`,voz:gancho},
      {tiempo:"3-15 s",pantalla:"Respuesta corta en texto grande.",voz:"[Respuesta directa en 2 frases.]"},
      {tiempo:"15-35 s",pantalla:arts?`Qué dice el ${artTxt} (con número en pantalla).`:"Por qué: [norma o cláusula que lo explica, con su número].",voz:"[Explicación con un ejemplo cotidiano.]"},
      {tiempo:"35-45 s",pantalla:"Texto: Ojo con…",voz:"[El error más común en esta situación.]"},
      {tiempo:"45-50 s",pantalla:"Texto: ¿Tenés otra pregunta? Dejala en comentarios.",voz:cta+" Y dejame tu pregunta en comentarios."}]}
  else{bloques=[{tiempo:"0-3 s",pantalla:`Texto grande: “${gancho}”`,voz:gancho},
      {tiempo:"3-12 s",pantalla:"Imagen simple de la situación cotidiana.",voz:"[El caso en una frase: a quién le pasa y cuándo.]"},
      ...(arts||fmt==="articulo"?[{...ley(`Texto literal del ${artTxt} en pantalla, con el número bien visible.`),tiempo:"12-30 s"}]:[]),
      {tiempo:"30-45 s",pantalla:"Texto grande: qué significa en la práctica.",voz:"[Qué significa para el día a día, sin consejo para un caso concreto.]"},
      {tiempo:"45-55 s",pantalla:"Texto: qué revisar antes de firmar.",voz:"[1 a 3 cosas para revisar.]"},
      {tiempo:"55-60 s",pantalla:"Texto: ¡Queda resaltado! · Mandáselo a quien lo necesite.",voz:"¡Queda resaltado! "+cta}]}
  const cuerpo=(e?`Temporada 1 · Episodio ${e[0]}: ${e[2]}. Código Civil y Comercial, ${artTxt}.`:tema?`Hoy: ${tema}.`:"")+"\n[Completá en 2 o 3 líneas qué muestra el reel, sin dar consejo para un caso puntual.]";
  const verificar=[arts?`Copiar el texto literal vigente del ${artTxt} desde InfoLEG (texto actualizado) y confirmar la numeración`:"Confirmar en InfoLEG el número y el texto vigente de cada artículo que se mencione","Completar lo que está entre corchetes antes de grabar"];
  return{titulo,gancho,bloques,musica,cta,palabraClave:kw,caption:sp_caption(gancho,cuerpo,kw),hashtags:SP_TAGS,articulos:arts,verificar,estado:"guion",formato:fmt,episodio:e?e[0]:"",sp_literal:"",source:"plantilla"}}

/* ---------- (a) Ideas y plan desde los pilares y la temporada ---------- */
function sp_slides(kind,titulo){const fin={titulo:"¿Te sirvió?",texto:`Guardalo y mandáselo a quien esté por firmar. Consultas por WhatsApp: ${SP_WA}.`};
  if(kind==="post")return[{titulo,texto:"[Respuesta breve en 2 o 3 líneas, sin consejo para un caso concreto.]"}];
  if(kind==="errores")return[{titulo,texto:"Deslizá: los 3 que más se repiten."},{titulo:"Error 1",texto:"[Qué se hace mal y qué conviene hacer.]"},{titulo:"Error 2",texto:"[Qué se hace mal y qué conviene hacer.]"},{titulo:"Error 3",texto:"[Qué se hace mal y qué conviene hacer.]"},{titulo:"Qué dice la norma",texto:"[Artículo con su número; verificá el texto vigente en InfoLEG.]"},fin];
  if(kind==="check")return[{titulo,texto:"Revisalo antes de firmar."},{titulo:"1. Partes y objeto",texto:"[Qué tiene que figurar.]"},{titulo:"2. Plazo y precio",texto:"[Qué tiene que figurar.]"},{titulo:"3. Actualización",texto:"[Qué tiene que figurar.]"},{titulo:"4. Garantías",texto:"[Qué tiene que figurar.]"},fin];
  return[{titulo,texto:"[En una línea, el problema que la persona reconoce como propio.]"},{titulo:"El problema",texto:"[La situación cotidiana en 2 líneas.]"},{titulo:"Qué dice la norma",texto:"[Artículo con su número; verificá el texto vigente en InfoLEG.]"},{titulo:"Qué mirar en tu contrato",texto:"[1 a 3 puntos concretos.]"},{titulo:"Error frecuente",texto:"[El error que más se repite y cómo evitarlo.]"},fin]}
function sp_ideaFrom(base,ang,pilar){const titulo=ang.t.replace("{P}",base).replace("{p}",base.charAt(0).toLowerCase()+base.slice(1));const kw=sp_kwFrom(base);
  const gancho=ang.g.replace("{p}",base.charAt(0).toLowerCase()+base.slice(1));
  return{titulo,formato:ang.f,objetivo:ang.o,audiencia:"Propietarios, inquilinos e inmobiliarias de Argentina",gancho,slides:sp_slides(ang.k,titulo),guion_reel:"",
    caption:sp_caption(gancho,"[Desarrollá en 3 o 4 líneas lo que muestra la pieza.]",kw),hashtags:SP_TAGS,cta:`Mandáselo a quien esté por firmar · comentá ${kw}`,
    recursos:ang.f==="post"?"Plantilla de publicación de marca":"Plantilla de carrusel de marca (azul noche y marfil)",
    justificacion:(pilar?`Pilar del piloto: «${pilar}». `:"")+(ang.f==="carrusel"?"El carrusel es el formato que más se guarda.":"Formato simple para preguntas frecuentes."),
    afirmaciones_a_verificar:["Verificar en InfoLEG cualquier artículo o norma que se cite antes de publicar"],sp_local:true}}
const SP_ANG=[{t:"Guía rápida: {P}",f:"carrusel",k:"guia",o:"Educar",g:"¿Sabés qué mirar en {p}?"},{t:"3 errores comunes: {P}",f:"carrusel",k:"errores",o:"Educar",g:"3 errores que se repiten en {p}"},{t:"Pregunta frecuente: {P}",f:"post",k:"post",o:"Responder dudas",g:"La pregunta que más me hacen sobre {p}"},{t:"Checklist: {P}",f:"carrusel",k:"check",o:"Guardar y compartir",g:"Antes de firmar, revisá esto"},{t:"{P}, explicado con un caso",f:"carrusel",k:"guia",o:"Educar",g:"Te lo cuento con un caso de todos los días"}];
function sp_ideas(tema){const used=new Set(S.posts.map(p=>sp_norm(p.title)));const n=sp_seed();const out=[];
  if(tema){SP_ANG.forEach(a=>out.push(sp_ideaFrom(tema,a,"")));return out}
  const pil=sp_rot(sp_pilares(),n%Math.max(1,sp_pilares().length));const angs=sp_rot(SP_ANG,n%SP_ANG.length);
  for(const [i,p] of pil.entries()){if(out.length>=3)break;let k=0;let x;do{x=sp_ideaFrom(p,angs[(i+k)%angs.length],p);k++}while(used.has(sp_norm(x.titulo))&&k<SP_ANG.length);if(!used.has(sp_norm(x.titulo)))out.push(x)}
  const hechos=new Set((S.reels||[]).map(r=>String(r.episodio||"")));
  for(const e of T1){if(out.length>=5)break;if(hechos.has(e[0])||used.has(sp_norm(`Ep. ${e[0]} · ${e[2]}`)))continue;const r=sp_reel("personajes",e[0],"");
    out.push({titulo:r.titulo,formato:"reel",objetivo:"Alcance (serie del Código)",audiencia:"Público general",gancho:r.gancho,slides:[],guion_reel:reelPlain(r),caption:r.caption,hashtags:r.hashtags,cta:r.cta,recursos:"Serie animada: Codiguito, Inciso, Clausulo, Resaltato y La Voz de la ley",justificacion:`Episodio ${e[0]} de la Temporada 1 todavía sin reel.`,afirmaciones_a_verificar:r.verificar,sp_local:true})}
  for(const [i,p] of pil.entries()){if(out.length>=5)break;const x=sp_ideaFrom(p,angs[(i+3)%angs.length],p);if(!out.some(o=>o.titulo===x.titulo)&&!used.has(sp_norm(x.titulo)))out.push(x)}
  return out.slice(0,5)}
function sp_plan(){const hora=pilot().hora||"19:00";const pil=sp_rot(sp_pilares(),sp_seed()%Math.max(1,sp_pilares().length));const hechos=new Set((S.reels||[]).map(r=>String(r.episodio||"")));const eps=T1.filter(e=>!hechos.has(e[0]));
  const out=[];let pi=0,ei=0,si=0;const objs=["Educativo","Comercial","Preguntas frecuentes"];
  for(let k=1;k<=16&&out.length<6;k++){const d=addDaysAR(todayAR(),k);const dow=new Date(d+"T12:00:00-03:00").getUTCDay();if(![1,3,5].includes(dow))continue;const i=out.length;const obj=objs[i%3];
    if(i%3===1&&eps.length){const e=eps[ei++%eps.length];out.push({fecha:d,hora,formato:"reel",titulo:`Ep. ${e[0]} · ${e[2]}`,objetivo:"Alcance (serie del Código)",tema:"Arts. "+e[1],cta:"Mandáselo a quien esté por firmar"})}
    else if(obj==="Comercial"){const s=SERVICES[si++%(SERVICES.length-1)];out.push({fecha:d,hora,formato:"post",titulo:"Cómo trabajo: "+s,objetivo:"Comercial",tema:s,cta:pilot().cta})}
    else{const p=pil[pi++%Math.max(1,pil.length)]||"Contratos de alquiler";out.push({fecha:d,hora,formato:obj==="Educativo"?"carrusel":"post",titulo:(obj==="Educativo"?"Guía rápida: ":"Pregunta frecuente: ")+p,objetivo:obj,tema:p,cta:"Guardalo y compartilo"})}}
  return out}
function sp_develop(p){const kw=sp_kwFrom(p.title);const cambios=[];const o={caption:p.caption||"",hashtags:p.hashtags||SP_TAGS,cta:p.cta||"",slides:arr(p.slides).filter(s=>(s.titulo||"").trim()||(s.texto||"").trim()),guion_reel:p.guionReel||"",afirmaciones_a_verificar:["Verificar en InfoLEG cualquier artículo o norma citada"]};
  if(!o.caption.trim()){o.caption=sp_caption(p.title||"[Gancho]","[Desarrollá en 3 o 4 líneas lo que muestra la pieza.]",kw);cambios.push("armé el texto con gancho, llamada a enviar, palabra clave y aclaración legal")}
  else if(!o.caption.includes(SP_DISC)){o.caption=o.caption.trimEnd()+"\n\n"+SP_DISC;cambios.push("agregué la aclaración legal al final")}
  if(!o.cta){o.cta=`Mandáselo a quien esté por firmar · comentá ${kw}`;cambios.push("sumé la llamada a la acción")}
  if(!p.hashtags){cambios.push("puse los hashtags base")}
  if(p.format==="carrusel"&&o.slides.length<3){o.slides=sp_slides("guia",p.title||"Título");cambios.push("armé 6 diapositivas con la estructura problema → norma → qué mirar → error → cierre")}
  else if(p.format==="post"&&!o.slides.length){o.slides=sp_slides("post",p.title||"Título");cambios.push("armé el texto de la imagen")}
  if(["reel","guion"].includes(p.format)&&!o.guion_reel.trim()){o.guion_reel=reelPlain(sp_reel("articulo","",p.title||""));cambios.push("armé un guion por bloques")}
  o.cambios=cambios.length?"Sin IA: "+cambios.join("; ")+". Completá lo que está entre corchetes.":"La pieza ya tenía lo básico: solo revisá las advertencias del editor.";return o}

/* ---------- (c) Secuencia de historias ---------- */
function sp_hist(obj,tema){const hoy=todayAR();const hp=S.posts.find(p=>(p.scheduledAt||"").startsWith(hoy));const hr=(S.reels||[]).find(r=>(r.scheduledAt||"").startsWith(hoy));
  const t=(tema||hp?.title||hr?.titulo||sp_pilares()[sp_seed()%Math.max(1,sp_pilares().length)]||"tu contrato de alquiler").slice(0,90);const tl=t.charAt(0).toLowerCase()+t.slice(1);
  const cut=s=>s.length>60?s.slice(0,57).trimEnd()+"…":s;
  const fin={tipo:"link",kicker:"Consultas",titulo:"¿Dudas con tu contrato?",texto:`Escribime por WhatsApp al ${SP_WA} o por mensaje privado.`,opciones:""};
  const F={post:[{tipo:"texto",kicker:"Hoy en el feed",titulo:cut("¿Te pasó con "+tl+"?"),texto:"Lo explico en la publicación de hoy.",opciones:""},{tipo:"encuesta",kicker:"Contame",titulo:"¿Te pasó alguna vez?",texto:"",opciones:"Sí / Todavía no"},{tipo:"texto",kicker:"Adelanto",titulo:"Lo que casi nadie revisa",texto:"[Un dato del post, en una línea.]",opciones:""},{tipo:"link",kicker:"Miralo completo",titulo:cut(hp?.title||hr?.titulo||t),texto:"Tocá para verlo en el perfil.",opciones:""},fin],
    educar:[{tipo:"texto",kicker:"Dato útil",titulo:cut("¿Sabés esto sobre "+tl+"?"),texto:"",opciones:""},{tipo:"quiz",kicker:"Probá",titulo:"¿Cuál es la correcta?",texto:"",opciones:"[Opción A] / [Opción B] / [Opción C]"},{tipo:"texto",kicker:"La respuesta",titulo:"[La opción correcta]",texto:"[Por qué, con el número de artículo. Verificalo en InfoLEG.]",opciones:""},{tipo:"pregunta",kicker:"Tu turno",titulo:"¿Qué otra duda tenés?",texto:"",opciones:"Preguntame sobre "+t.slice(0,40)},fin],
    interactuar:[{tipo:"encuesta",kicker:"Encuesta",titulo:"¿Leíste tu contrato antes de firmar?",texto:"",opciones:"Todo / Por arriba / Nada"},{tipo:"quiz",kicker:"Quiz",titulo:cut("¿Qué sabés de "+tl+"?"),texto:"",opciones:"[Opción A] / [Opción B]"},{tipo:"pregunta",kicker:"Preguntas",titulo:"Preguntame lo que quieras",texto:"Respondo las más repetidas en un reel.",opciones:"Tu duda sobre contratos"},{tipo:"texto",kicker:"Resultado",titulo:"[Comentá el resultado de la encuesta]",texto:"",opciones:""},fin],
    vender:[{tipo:"texto",kicker:"Cláusula Legal",titulo:"Contratos claros, sin vueltas",texto:"Modalidad digital para todo el país.",opciones:""},{tipo:"texto",kicker:"Qué hago",titulo:"Servicios",texto:SERVICES.filter(s=>s!=="Otro").slice(0,4).join(" · "),opciones:""},{tipo:"encuesta",kicker:"Contame",titulo:"¿Estás por firmar un contrato?",texto:"",opciones:"Sí, pronto / Más adelante"},{tipo:"texto",kicker:"Cómo trabajo",titulo:"Me pasás los datos y lo armamos",texto:"Revisión documental e informativa: no reemplaza el asesoramiento de un abogado matriculado.",opciones:""},fin],
    detras:[{tipo:"texto",kicker:"Detrás de escena",titulo:"Así preparo el contenido",texto:"[Foto o video del escritorio.]",opciones:""},{tipo:"texto",kicker:"Hoy",titulo:cut("Estoy con "+tl),texto:"",opciones:""},{tipo:"encuesta",kicker:"Elegí",titulo:"¿Qué tema querés que siga?",texto:"",opciones:"[Tema A] / [Tema B]"},{tipo:"pregunta",kicker:"Preguntas",titulo:"¿Qué te gustaría ver?",texto:"",opciones:"Proponé un tema"},fin]};
  return{objetivo:obj,frames:(F[obj]||F.post).map(f=>({...f})),source:"plantilla",tema:t,verificar:["Completar lo que está entre corchetes antes de subir"]}}

/* ---------- (d) Captación por tipo de consulta ---------- */
const SP_TIPOS=[["auto","Detectar en el mensaje"],["precio","Precio"],["plazos","Plazos"],["modalidad","Modalidad"],["urgencia","Urgencia"]];
function sp_detect(m){const s=sp_norm(m);const t=[];if(/precio|cuanto (sale|cuesta|cobr)|valor|costo|presupuesto|tarifa|honorario/.test(s))t.push("precio");if(/plazo|cuanto tard|demora|para cuando|cuantos dias|cuando estaria|entrega/.test(s))t.push("plazos");
  if(/modalidad|presencial|virtual|online|a distancia|otra provincia|de donde sos|viaj|zoom|videollamada|donde atend/.test(s))t.push("modalidad");if(/urgent|urgencia|\bhoy\b|manana|ya mismo|cuanto antes|lo antes posible|rapido/.test(s))t.push("urgencia");return t}
function sp_servicio(m){const s=sp_norm(m);return /temporari|turist|vacacion/.test(s)?"Contrato de locación temporaria":/comercial|local|negocio|oficina/.test(s)?"Contrato de locación comercial":/revis|leer|chequear|mirar el contrato/.test(s)?"Revisión de contrato":/modelo|plantilla/.test(s)?"Modelo de contrato":/actualiz|aumento|indice|icl|ipc/.test(s)?"Aviso de actualizaciones":/alquil|vivienda|depto|departamento|casa|inquilin|propietari/.test(s)?"Contrato de locación de vivienda":"Otro"}
function sp_captacion(msg,forz){const tipos=forz&&forz!=="auto"?[forz]:sp_detect(msg);const precios=String(S.settings.precios||"").trim();const plazo=String(S.settings.sp_plazo||"").trim();const serv=sp_servicio(msg);
  const nom=(String(msg).match(/(?:soy|me llamo|mi nombre es)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/)||[])[1]||"";
  const P=[`¡Hola${nom?" "+nom:""}! Gracias por escribir a Cláusula Legal.`];
  if(tipos.includes("precio"))P.push(precios?`Te paso los valores vigentes:\n${precios}\nSi me contás qué contrato necesitás, te confirmo el presupuesto.`:"El valor queda a definir según el tipo de contrato y lo que haga falta. Si me contás qué necesitás, te paso el presupuesto.");
  if(tipos.includes("plazos"))P.push(plazo?`El plazo habitual es ${plazo}, desde que tengo todos los datos.`:"El plazo queda a definir: depende del tipo de contrato y de tener todos los datos. Apenas los tenga, te confirmo la fecha.");

function sp_modoPanel(full){const cl=S.caps.sample,mc=S.caps.mcp;const im=typeof assetsCap!=="undefined"&&assetsCap,dl=typeof downloads!=="undefined"&&downloads;const pro=cl==="ok"&&mc==="ok";
  const titulo=pro?"Modo completo":cl==="wait"||mc==="wait"?"Verificando conexiones":"Modo sin Pro";
  const siempre=["Guiones de reels por plantilla, con campo para el texto literal","Secuencias de historias con sticker y cierre a WhatsApp","Ideas y plan de 2 semanas desde tus pilares y la Temporada 1","Respuestas de captación con tus precios (o “a definir”)","Director por reglas: trabas, días vacíos, reels incompletos","Teleprompter, controles de marca y copiar textos"];
  const claude=["Redacción completa de guiones, ideas e historias","Director con análisis y criterio","Desarrollo de piezas a partir de un borrador"];
  const metri=["Métricas reales de Instagram y mejores horarios","Programar en Metricool tras tu aprobación","Verificar que la publicación salió"];
  if(!full)return `<section class="panel sp-modo" style="grid-column:1/-1"><div class="ph"><h2>${titulo}</h2><a href="#config">Qué incluye</a></div>
    <div class="sp-chips"><span class="chip ok">Sin IA: guiones, historias, ideas, captación y Director por reglas</span>${sp_capChip(cl,"Claude encendido","Claude apagado")}${sp_capChip(mc,"Metricool encendido","Metricool apagado")}</div>
    ${pro?"":`<p class="small muted" style="margin:0">La app sigue funcionando con plantillas y reglas: en cada sección hay botones “sin IA”. ${cl==="off"?"Cuando Claude esté disponible, se suman los agentes que redactan. ":""}${mc==="off"?"Con Metricool se encienden las métricas reales y la programación.":""}</p>`}</section>`;
  const col=(t,chip,items)=>`<div class="sp-col"><h3>${t}${chip}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<section class="panel sp-modo" style="grid-column:1/-1"><div class="ph"><h2>${titulo}: qué funciona hoy</h2></div>
  <div class="sp-cols">${col("Siempre (sin Pro)",`<span class="chip ok">Activo</span>`,siempre)}${col("Con Claude",sp_capChip(cl,"Encendido","Apagado"),claude)}${col("Con Metricool",sp_capChip(mc,"Encendido","Apagado"),metri)}${col("Imágenes y descargas",`<span class="chip ${im&&dl?"ok":im||dl?"":"warn"}">${im&&dl?"Encendido":im||dl?"Parcial":"Apagado"}</span>`,["Imágenes con la plantilla de marca","Descargar zip y copia de seguridad","Sin esto: copiá los textos y diseñá con tu plantilla"])}</div>
  <h3>Datos para las respuestas sin IA</h3><div class="fields"><label for="sp-precios">Servicios y precios (uno por línea)<textarea id="sp-precios" style="min-height:80px" placeholder="Ej.: Contrato de locación de vivienda: $…">${esc(S.settings.precios||"")}</textarea></label><label for="sp-plazo">Plazo habitual de entrega<input id="sp-plazo" value="${esc(S.settings.sp_plazo||"")}" placeholder="Ej.: 48 a 72 horas hábiles"></label></div>
  <span class="small muted">Si los dejás vacíos, las respuestas dicen “a definir”. Nunca se inventa un precio ni un plazo.</span><button class="btn sm primary" data-sp="cfg" style="align-self:flex-start">Guardar</button></section>`}
const sp_vPanelO=vPanel;vPanel=()=>{const h=sp_vPanelO();const g=`<div class="grid">`;const i=h.indexOf(g);return i<0?h+sp_modoPanel(false):h.slice(0,i+g.length)+sp_modoPanel(false)+h.slice(i+g.length)};
const sp_vConfigO=vConfig;vConfig=()=>{const h=sp_vConfigO();const g=`<div class="grid">`;const i=h.indexOf(g);return i<0?h+sp_modoPanel(true):h.slice(0,i+g.length)+sp_modoPanel(true)+h.slice(i+g.length)};

/* ---------- Eventos ---------- */
document.addEventListener("click",async ev=>{const el=ev.target.closest("[data-sp]");if(!el)return;const k=el.dataset.sp;
  try{switch(k){
  case"run":await sp_runLocal(el.dataset.spa,el.dataset.spt);break;
  case"reel":{const fmt=$("#rfFmt")?.value||"personajes",ep=$("#rfEp")?.value||"",tema=($("#rfTema")?.value||"").trim();if(!ep&&!tema){toast("Elegí un episodio o escribí un tema");break}
    openReel(null,sp_reel(fmt,ep,tema));toast("Guion armado con plantilla: pegá el texto literal y completá lo que está entre corchetes");break}
  case"hist":{const obj=$("#hfObj")?.value||"post",tema=($("#hfTema")?.value||"").trim();openHist(null,sp_hist(obj,tema));toast("Secuencia armada con plantilla: revisala y guardala");break}
  case"dir":await sp_directorRun();break;
  case"cfg":await saveSettings({precios:$("#sp-precios").value.trim(),sp_plazo:$("#sp-plazo").value.trim()});toast("Datos guardados");render();break;
  }}catch(e){if(e?.message!=="no-db"){console.error(e);toast("No se pudo completar la acción")}}});

render();
</script>
