async function dbSet(path,data){if(!db){toast("Los datos no se pueden guardar en esta vista");throw new Error("no-db")}

async function dbUpdate(path,data){if(!db){toast("Los datos no se pueden guardar en esta vista");throw new Error("no-db")}

async function dbDelete(path){if(!db)return;try{await db.doc(path).delete()}catch(e){toast(dbMsg(e))}}
function dbMsg(e){return e?.code==="quota_exceeded"?"Se llenó el espacio de datos: borrá registros viejos":e?.code==="invalid_argument"?"No tenés permiso para guardar acá, o el dato es inválido":"No se pudo guardar. Probá de nuevo en un momento"}

function metricsStamp(){return S.metrics.at?"Actualizado "+ago(S.metrics.at):""}
function metricsBlock(){const m=S.metrics;
  if(S.caps.mcp==="off")return `<div class="empty">Metricool no está disponible en esta vista. Conectalo en claude.ai → Configuración → Conectores.</div>`;
  if(m.state==="loading"&&!m.rows.length)return `<div class="status"><span class="spin"></span>Consultando Metricool…</div>`;
  if(m.state==="error"&&!m.rows.length)return `<div class="empty"><span>${esc(m.error)}</span><button class="btn sm" data-act="loadMetrics" style="align-self:flex-start">Reintentar</button></div>`;
  if(!m.rows.length)return `<div class="empty">Metricool no registra publicaciones en los últimos 90 días.</div>`;
  const tot=k=>m.rows.reduce((s,r)=>s+(+r[k]||0),0);
  return `<div class="small muted">Datos observados de Metricool, últimos 90 días: ${m.rows.length} ${m.rows.length===1?"publicación":"publicaciones"}, alcance total ${tot("reach")}, interacciones ${tot("interactions")}, guardados ${tot("saved")}, seguidores ganados ${tot("follows")}.</div>
  <div class="tbl"><table><thead><tr><th>Fecha</th><th>Publicación</th><th>Tipo</th><th class="n">Alcance</th><th class="n">Interac.</th><th class="n">Guardados</th><th class="n">Compart.</th><th class="n">Seguidores</th></tr></thead><tbody>
  ${m.rows.map(r=>`<tr><td style="white-space:nowrap">${esc(r.dateLabel)}</td><td style="min-width:220px">${r.url?`<a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.text.slice(0,80))}${r.text.length>80?"…":""}</a>`:esc(r.text.slice(0,80))}</td><td>${esc(r.type)}</td><td class="n">${r.reach??"–"}</td><td class="n">${r.interactions??"–"}</td><td class="n">${r.saved??"–"}</td><td class="n">${r.shares??"–"}</td><td class="n">${r.follows??"–"}</td></tr>`).join("")}
  </tbody></table></div>${m.state==="error"?`<div class="small" style="color:var(--warn)">No se pudo actualizar: se muestran los últimos datos obtenidos.</div>`:""}`;
}
function scheduledBlock(){const s=S.scheduled;
  if(S.caps.mcp!=="ok")return"";
  if(s.state==="loading")return `<div class="status"><span class="spin"></span>Consultando la agenda de Metricool…</div>`;
  if(s.state==="error")return `<div class="small muted">Agenda de Metricool: ${esc(s.error)}</div>`;
  if(s.state!=="done")return"";
  return `<h3>En la agenda de Metricool</h3>${s.items.length?`<div class="list">${s.items.map(i=>`<div class="row"><span class="t">${esc(i.text)}</span><span class="small muted" style="white-space:nowrap">${esc(i.when)}</span></div>`).join("")}</div>`:`<div class="small muted">No hay publicaciones programadas en Metricool para los próximos 60 días.</div>`}`;
}

function postWarnings(p){const w=[];
  if((p.caption||"").length>2200)w.push(["bad","El texto supera los 2.200 caracteres que permite Instagram."]);
  const tags=(p.hashtags||"").match(/#\S+/g)||[];if(tags.length>30)w.push(["bad","Más de 30 hashtags: Instagram no lo permite."]);
  (p.slides||[]).forEach((s,i)=>{if((s.titulo||"").length>70)w.push(["warn",`Diapositiva ${i+1}: el título es largo para leerse en el celular (más de 70 caracteres).`]);if((s.texto||"").length>220)w.push(["warn",`Diapositiva ${i+1}: mucho texto (más de 220 caracteres). Dividilo en dos diapositivas.`])});
  if(p.format==="carrusel"&&(p.slides||[]).length>20)w.push(["bad","Instagram admite hasta 20 diapositivas por carrusel."]);
  if(!p.cta)w.push(["warn","Falta llamada a la acción."]);
  if((p.verificar||[]).length)w.push(["warn",`Hay ${p.verificar.length} afirmaciones jurídicas para verificar antes de publicar.`]);
  if(/abogad[oa]\s+matriculad|matr[ií]cula\s+n|soy\s+abogad/i.test(((p.caption||"")+JSON.stringify(p.slides||[])).replace(/(asesoramiento|revisi[oó]n|firma|consulta)[^.\n]{0,40}abogad[oa]\s+matriculad[oa]/gi,"")))w.push(["bad","El texto menciona una matrícula profesional que todavía no tenés."]);
  return w}

async function requestSchedule(){readPostForm();const p=editing;
  const media=(p.media||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const errs=[];if(!p.scheduledAt)errs.push("una fecha y hora");if(p.scheduledAt&&p.scheduledAt<=nowAR())errs.push("una fecha futura");if(!media.length)errs.push("al menos una imagen o video final");
  if(["reel"].includes(p.format)&&media.length&&!/\.(mp4|mov)|drive|dropbox/i.test(media[0]))errs.push("un video para el Reel");
  if(p.format==="guion")errs.push("un formato publicable (el guion audiovisual no se publica)");
  if(errs.length){toast("Para programar falta "+errs.join(", "));return}
  if(postWarnings(p).some(w=>w[0]==="bad")){toast("Resolvé las advertencias en rojo antes de programar");return}
  await savePost();
  if(S.approvals.some(a=>a.postId===p.id&&["pendiente","ejecutando"].includes(a.status))){toast("Ya hay una solicitud pendiente para esta pieza");return}
  const id=newId("apr");
  const igType=p.format==="reel"?"REEL":p.format==="historia"?"STORY":"POST";
  await dbSet("approvals/"+id,{id,tipo:"programar_publicacion",postId:p.id,status:"pendiente",createdAt:Date.now(),
    titulo:"Programar: "+(p.title||"pieza sin título"),
    que:`Crear una publicación programada (${igType==="POST"?(media.length>1?"carrusel":"publicación"):igType==="REEL"?"Reel":"historia"}) que Metricool publicará automáticamente.`,
    cuenta:"Instagram @"+S.settings.igUser+" · marca de Metricool "+S.settings.brandId,
    contenido:(igType==="STORY"?"(Las historias no llevan texto)":(p.caption||"")+(p.hashtags?"\n\n"+p.hashtags:"")),
    media,cuando:niceDate(p.scheduledAt)+" (hora de Argentina)",scheduledAt:p.scheduledAt,igType,
    consecuencias:"Al aprobar, la publicación queda programada en Metricool y saldrá en tu perfil público a esa hora, salvo que la canceles desde Metricool antes. Es visible para cualquier persona."});
  closeDrawer();location.hash="#aprobaciones";toast("Solicitud enviada a Aprobaciones")}

    <div class="btns"><button class="btn primary" data-act="approve" data-id="${esc(a.id)}" ${a.status!=="pendiente"||S.caps.mcp!=="ok"?"disabled":""}>Aprobar y programar</button><button class="btn" data-act="openPost" data-id="${esc(a.postId)}">Editar pieza</button><button class="btn" data-act="reject" data-id="${esc(a.id)}" ${a.status!=="pendiente"?"disabled":""}>Rechazar</button><button class="btn danger" data-act="cancelApr" data-id="${esc(a.id)}" ${a.status!=="pendiente"?"disabled":""}>Cancelar solicitud</button></div>

  <section class="panel"><h2>Registro</h2><div class="list">${done.map(a=>`<div class="row"><div><div class="t">${esc(a.titulo)}</div><div class="s">${esc(a.resultado||"")}${a.decidedAt?" · "+new Date(a.decidedAt).toLocaleString("es-AR",{timeZone:TZ}):""}${a.decidedBy?" · decidió "+(a.decidedBy===S.uid?"vos":"otra persona"):""}</div>${a.plannerUrl?`<a class="link" href="${esc(a.plannerUrl)}" target="_blank" rel="noopener">Ver en Metricool</a>`:""}</div><span class="chip ${a.status==="ejecutada"?"ok":a.status==="fallida"||a.status==="incierta"?"bad":""}">${esc(a.status)}</span></div>`).join("")||`<div class="empty">Sin decisiones registradas.</div>`}</div></section>`}
async function approve(id){const a=S.approvals.find(x=>x.id===id);if(!a||a.status!=="pendiente")return;
  const p=S.posts.find(x=>x.id===a.postId);if(!p){toast("La pieza ya no existe");return}
  await dbUpdate("approvals/"+id,{status:"ejecutando",decidedAt:Date.now(),decidedBy:S.uid});
  const info={autoPublish:true,draft:false,descendants:[],firstCommentText:"",hasNotReadNotes:false,media:a.media,mediaAltText:[],
    providers:[{network:"instagram"}],publicationDate:{dateTime:a.scheduledAt+":00",timezone:TZ},shortener:false,smartLinkData:{ids:[]},
    instagramData:{type:a.igType,showReelOnFeed:true,isAiGenerated:false}};
  if(a.igType!=="STORY")info.text=(p.caption||"")+(p.hashtags?"\n\n"+p.hashtags:"");
  try{const r=await mcp.callTool(MC,"createScheduledPost",{blogId:String(S.settings.brandId),date:a.scheduledAt+":00-03:00",info:JSON.stringify(info)});
    const pl=r.payload;const url=findKey(pl,"plannerUrl");
    await dbUpdate("approvals/"+id,{status:"ejecutada",resultado:"Programada en Metricool",plannerUrl:url||null});
    await dbUpdate("posts/"+p.id,{stage:"programado",plannerUrl:url||null,history:[...(p.history||[]),{stage:"programado",at:Date.now(),by:S.uid,note:"Programada en Metricool tras aprobación"}]});
    toast("Programada en Metricool");loadScheduled()}
  catch(e){const amb=["server_unavailable","upstream_error","cancelled"].includes(e?.code);
    const msg=e?.code==="tool_error"?"Metricool rechazó la publicación: "+String(e.message||"").slice(0,240):e?.code==="needs_reauth"?"Volvé a conectar Metricool en claude.ai → Configuración → Conectores":e?.code==="not_in_manifest"||e?.code==="approval_required"?"No autorizaste a la app a usar Metricool":amb?"Sin respuesta clara de Metricool. Revisá su planificador antes de reintentar para no duplicar":"No se pudo programar ("+(e?.code||"error")+")";
    await dbUpdate("approvals/"+id,{status:amb?"incierta":"fallida",resultado:msg});
    if(!amb)await dbUpdate("posts/"+p.id,{stage:"error",history:[...(p.history||[]),{stage:"error",at:Date.now(),by:S.uid,note:msg}]});
    toast(msg)}}
function findKey(o,k){if(!o||typeof o!=="object")return null;if(k in o)return o[k];for(const v of Object.values(o)){const r=findKey(v,k);if(r)return r}return null}
async function verifyPublication(){const p=editing;if(!mcp){toast("Metricool no está disponible");return}
  toast("Buscando la publicación en Metricool…");await loadMetrics(true);
  const head=(p.caption||"").trim().slice(0,60);const hit=S.metrics.rows.find(r=>head&&r.text.trim().startsWith(head));
  if(hit){await dbUpdate("posts/"+p.id,{stage:"publicado",publishedAt:Date.now(),igUrl:hit.url||null,history:[...(p.history||[]),{stage:"publicado",at:Date.now(),by:S.uid,note:"Confirmada por Metricool"}]});closeDrawer();toast("Confirmada: la publicación está en Instagram")}
  else toast("Metricool todavía no registra esta publicación. Sigue como programada")}

    prompt=`${ctx}\nTAREA: Proponé 5 ideas de publicaciones de Instagram para Cláusula Legal${tema?` sobre: ${tema}`:""}, útiles para propietarios, inquilinos o inmobiliarias en Argentina. Variá formatos (carrusel, reel, publicación).\nRespondé SOLO un array JSON de 5 objetos con: titulo, formato ("carrusel"|"reel"|"post"), objetivo, audiencia, gancho, slides (array de {titulo,texto}; para reel, array vacío), guion_reel (texto con escenas, narración, duración y sonido sugerido; vacío si no es reel), caption, hashtags (string), cta, recursos (qué imágenes o materiales hacen falta), justificacion (por qué conviene estratégicamente), afirmaciones_a_verificar (array de strings).`}
  else if(agent==="contenido"&&task==="plan"){label="Plan editorial de 2 semanas";
    prompt=`${ctx}\nTAREA: Armá un calendario editorial para las próximas 2 semanas desde ${todayAR()}, con 3 publicaciones por semana, alternando educativo, comercial y preguntas frecuentes.\nRespondé SOLO un array JSON de objetos {fecha:"YYYY-MM-DD", hora:"HH:MM", formato:"carrusel"|"reel"|"post", titulo, objetivo, tema, cta}. No inventes horarios "óptimos": usá 19:00 como horario provisorio salvo que tengas datos reales.`}
  else if(agent==="contenido"&&task==="desarrollar"){const pid=$("#tc-post")?.value;const p=S.posts.find(x=>x.id===pid);if(!p){toast("Elegí una pieza del Estudio");return}
    label="Desarrollar: "+p.title;extra.postId=p.id;
    prompt=`${ctx}\nTAREA: Desarrollá completa esta pieza:\n${JSON.stringify({titulo:p.title,formato:p.format,objetivo:p.objetivo,audiencia:p.audiencia,caption:p.caption,slides:p.slides,guion_reel:p.guionReel,cta:p.cta,notas:p.notas})}\nRespondé SOLO un objeto JSON con: caption (máx. 1800 caracteres), hashtags (string, máx. 12), cta, slides (array de {titulo (máx. 60 caracteres), texto (máx. 200)}; entre 5 y 9 si es carrusel; 1 si es post; vacío si es reel), guion_reel (si es reel: escenas numeradas con duración, narración y sonido; si no, vacío), afirmaciones_a_verificar (array), cambios (resumen breve de lo que hiciste).`}
  else if(agent==="crecimiento"&&task==="analizar"){label="Analizar rendimiento";
    if(S.caps.mcp==="ok")await loadMetrics(true);
    const rows=S.metrics.rows.map(r=>({fecha:r.dateLabel,tipo:r.type,texto:r.text.slice(0,120),alcance:r.reach,interacciones:r.interactions,guardados:r.saved,compartidos:r.shares,vistas:r.views,seguidores:r.follows}));
    prompt=`${ctx}\nDATOS OBSERVADOS de Metricool, Instagram, últimos 90 días (${rows.length} publicaciones):\n${JSON.stringify(rows)}\n${S.caps.mcp!=="ok"?"(Metricool no estuvo disponible: no hay datos.)":""}\nTAREA: Analizá el rendimiento. Si hay pocas publicaciones, decilo con claridad y no saques conclusiones estadísticas.\nRespondé SOLO un objeto JSON con: observado (array: solo hechos que salen de los datos), hipotesis (array), recomendaciones (array), experimentos (array de {nombre, hipotesis, como_hacerlo, como_medir, duracion}), datos_suficientes (boolean).`}
  else if(agent==="crecimiento"&&task==="perfil"){const bio=$("#tg-bio")?.value.trim();if(!bio){toast("Pegá la biografía actual del perfil");return}label="Revisar perfil";
    prompt=`${ctx}\nBiografía actual de @${S.settings.igUser}:\n"""${bio}"""\nTAREA: Revisá la biografía para mejorar claridad y conversión (máx. 150 caracteres por propuesta).\nRespondé SOLO un objeto JSON con: problemas (array), propuestas (array de 3 strings), enlace_recomendado (qué poner en el enlace de la bio), justificacion.`}
  else if(agent==="captacion"&&task==="atender"){const msg=$("#ts-msg")?.value.trim();if(!msg){toast("Pegá el mensaje recibido");return}
    const lid=$("#ts-lead")?.value;const lead=S.leads.find(l=>l.id===lid);label="Preparar respuesta"+(lead?": "+lead.nombre:"");extra={leadId:lid||null,mensaje:msg};
    prompt=`${ctx}\nServicios y precios del responsable:\n${S.settings.precios||"(no cargados: no inventes precios)"}\nPlantillas de bienvenida aprobadas:\n${(S.settings.plantillas||[]).join("\n---\n")||"(ninguna)"}\n${lead?"Ficha del contacto: "+JSON.stringify({nombre:lead.nombre,servicio:lead.servicio,estado:lead.estado,notas:lead.notas}):""}\nMENSAJE RECIBIDO:\n"""${msg}"""\nTAREA: Prepará la atención comercial. Trato profesional y cálido. No prometas resultados, no afirmes matrícula, no aceptes ni cierres precios: si preguntan precio y no hay lista, proponé pedir datos para presupuestar.\nRespondé SOLO un objeto JSON con: nombre_detectado, servicio (uno de: ${SERVICES.join(", ")}), prioridad ("alta"|"media"|"baja"), motivo_prioridad, resumen, preguntas_calificacion (array), borrador_respuesta, siguiente_paso, datos_para_contrato (array de datos a pedir).`}
  else if(agent==="captacion"&&task==="bienvenida"){label="Mensajes de bienvenida";
    prompt=`${ctx}\nTAREA: Escribí 3 mensajes de bienvenida para responder mensajes privados nuevos en Instagram, y 3 respuestas rápidas para preguntas frecuentes (precio, plazos, modalidad a distancia).\nRespondé SOLO un objeto JSON con: bienvenida (array de 3 strings), respuestas_rapidas (array de {pregunta, respuesta}).`}
  else if(agent==="captacion"&&task==="presupuesto"){const lead=S.leads.find(l=>l.id===extra.leadId||l.id===runAgent.leadId);if(!lead)return;extra={leadId:lead.id};label="Borrador de presupuesto: "+lead.nombre;
    prompt=`${ctx}\nServicios y precios del responsable:\n${S.settings.precios||"(no cargados)"}\nFicha: ${JSON.stringify({nombre:lead.nombre,servicio:lead.servicio,notas:lead.notas,datos:lead.datos})}\nTAREA: Prepará un borrador de presupuesto. Usá SOLO precios de la lista; si no hay, poné "a definir". Aclaraciones obligatorias: es un borrador, no constituye asesoramiento de un profesional matriculado.\nRespondé SOLO un objeto JSON con: items (array de {concepto, detalle, precio}), plazo_entrega, condiciones, validez, aclaraciones (array).`}
  else return;
  S.agentBusy[agent]="Trabajando: "+label+"…";render();
  try{const out=await sample.json(prompt,{modelTier:task==="bienvenida"?"default":"default",cache:false});
    const sum=summarize(agent,task,out);const runId=await logRun(agent,label,sum,out);
    S.agentOut[agent]={task,label,out,runId,extra};toast(agentName(agent)+": listo")}
  catch(e){if(e?.code!=="cancelled")toast(sampleMsg(e))}
  finally{delete S.agentBusy[agent];render();if(S.agentOut[agent])document.getElementById("out-"+agent)?.scrollIntoView({behavior:"smooth",block:"start"})}}
function summarize(agent,task,o){try{if(Array.isArray(o))return o.length+" propuestas: "+o.slice(0,3).map(x=>x.titulo||x.tema).join(" · ");
  if(task==="analizar")return(o.datos_suficientes===false?"Datos insuficientes. ":"")+(o.recomendaciones||[]).slice(0,1).join("");
  if(task==="atender")return(o.nombre_detectado||"Consulta")+" · "+(o.servicio||"")+" · prioridad "+(o.prioridad||"");
  if(task==="desarrollar")return o.cambios||"Pieza desarrollada";if(task==="perfil")return(o.propuestas||[])[0]||"Revisión de perfil";
  if(task==="presupuesto")return(o.items||[]).length+" conceptos";return"Resultado listo"}catch(e){return"Resultado listo"}}
const arr=v=>Array.isArray(v)?v:v?[v]:[];
function outBlock(agent){const r=S.agentOut[agent];const o=r.out;let body="";
  const verif=v=>arr(v).length?`<dt>Verificar</dt><dd>${arr(v).map(esc).join("\n")}</dd>`:"";

  else if(r.task==="plan")body=`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Formato</th><th>Tema</th><th>Objetivo</th></tr></thead><tbody>${arr(o).map(x=>`<tr><td style="white-space:nowrap">${esc(x.fecha)} ${esc(x.hora||"")}</td><td>${esc(fmtLabel(x.formato))}</td><td><b>${esc(x.titulo)}</b><br><span class="small muted">${esc(x.tema)}</span></td><td>${esc(x.objetivo)}</td></tr>`).join("")}</tbody></table></div><div class="btns"><button class="btn primary sm" data-act="savePlan">Agregar todo al Estudio como ideas con fecha</button></div>`;
  else if(r.task==="desarrollar")body=`<div class="prop"><h4>${esc(S.posts.find(p=>p.id===r.extra.postId)?.title||"Pieza")}</h4><dl class="kv"><dt>Cambios</dt><dd>${esc(o.cambios)}</dd>${arr(o.slides).length?`<dt>Diapositivas</dt><dd>${arr(o.slides).map((s,k)=>`${k+1}. ${esc(s.titulo)} — ${esc(s.texto)}`).join("\n")}</dd>`:""}${o.guion_reel?`<dt>Guion</dt><dd>${esc(o.guion_reel)}</dd>`:""}<dt>Caption</dt><dd>${esc(o.caption)}</dd><dt>Hashtags</dt><dd>${esc(o.hashtags)}</dd><dt>CTA</dt><dd>${esc(o.cta)}</dd>${verif(o.afirmaciones_a_verificar)}</dl><div class="btns"><button class="btn sm primary" data-act="applyDev">Aplicar a la pieza (guarda versión anterior)</button><button class="btn sm" data-act="learn" data-agent="contenido" data-i="-1">Descartar y explicar por qué</button></div></div>`;
  else if(r.task==="analizar")body=`<div class="prop">${o.datos_suficientes===false?`<span class="chip warn" style="align-self:flex-start">Datos insuficientes para conclusiones firmes</span>`:""}<dl class="kv"><dt>Observado</dt><dd>${arr(o.observado).map(esc).join("\n")||"–"}</dd><dt>Hipótesis</dt><dd>${arr(o.hipotesis).map(esc).join("\n")||"–"}</dd><dt>Recomendaciones</dt><dd>${arr(o.recomendaciones).map(esc).join("\n")||"–"}</dd></dl>${arr(o.experimentos).map(x=>`<div style="border-top:1px solid var(--line);padding-top:8px"><b>${esc(x.nombre)}</b><dl class="kv"><dt>Hipótesis</dt><dd>${esc(x.hipotesis)}</dd><dt>Cómo</dt><dd>${esc(x.como_hacerlo)}</dd><dt>Medición</dt><dd>${esc(x.como_medir)} · ${esc(x.duracion)}</dd></dl></div>`).join("")}</div>`;
  else if(r.task==="perfil")body=`<div class="prop"><dl class="kv"><dt>Problemas</dt><dd>${arr(o.problemas).map(esc).join("\n")}</dd><dt>Enlace</dt><dd>${esc(o.enlace_recomendado)}</dd><dt>Por qué</dt><dd>${esc(o.justificacion)}</dd></dl>${arr(o.propuestas).map(b=>`<div class="row"><span style="white-space:pre-wrap">${esc(b)}</span><button class="btn sm" data-act="copyText" data-text="${esc(b)}">Copiar</button></div>`).join("")}</div>`;
  else if(r.task==="atender")body=`<div class="prop"><div class="btns"><span class="chip ${o.prioridad==="alta"?"bad":o.prioridad==="media"?"warn":""}">Prioridad ${esc(o.prioridad)}</span><span class="chip">${esc(o.servicio)}</span></div><dl class="kv"><dt>Contacto</dt><dd>${esc(o.nombre_detectado)}</dd><dt>Resumen</dt><dd>${esc(o.resumen)}</dd><dt>Prioridad</dt><dd>${esc(o.motivo_prioridad)}</dd><dt>Preguntas</dt><dd>${arr(o.preguntas_calificacion).map(esc).join("\n")}</dd><dt>Siguiente paso</dt><dd>${esc(o.siguiente_paso)}</dd><dt>Datos a pedir</dt><dd>${arr(o.datos_para_contrato).map(esc).join("\n")}</dd></dl><label for="replyDraft">Borrador de respuesta (editalo antes de enviar)<textarea id="replyDraft" style="min-height:140px">${esc(o.borrador_respuesta)}</textarea></label><div class="btns"><button class="btn sm primary" data-act="copyReply">Copiar respuesta</button><button class="btn sm" data-act="saveLeadFromAgent">${r.extra.leadId?"Guardar en la ficha":"Registrar como contacto"}</button></div><span class="small muted">La app no envía mensajes: copiá la respuesta y enviala vos desde Instagram.</span></div>`;
  else if(r.task==="bienvenida")body=`<div class="prop">${arr(o.bienvenida).map((b,i)=>`<div class="row"><span style="white-space:pre-wrap">${esc(b)}</span><div class="btns"><button class="btn sm" data-act="copyText" data-text="${esc(b)}">Copiar</button><button class="btn sm" data-act="keepTpl" data-text="${esc(b)}">Aprobar como plantilla</button></div></div>`).join("")}<h4 style="margin-top:6px">Respuestas rápidas</h4>${arr(o.respuestas_rapidas).map(q=>`<div class="row"><div><div class="t small">${esc(q.pregunta)}</div><div style="white-space:pre-wrap">${esc(q.respuesta)}</div></div><button class="btn sm" data-act="copyText" data-text="${esc(q.respuesta)}">Copiar</button></div>`).join("")}</div>`;
  else if(r.task==="presupuesto")body=`<div class="prop"><div class="tbl"><table><thead><tr><th>Concepto</th><th>Detalle</th><th class="n">Precio</th></tr></thead><tbody>${arr(o.items).map(x=>`<tr><td>${esc(x.concepto)}</td><td>${esc(x.detalle)}</td><td class="n">${esc(x.precio)}</td></tr>`).join("")}</tbody></table></div><dl class="kv"><dt>Plazo</dt><dd>${esc(o.plazo_entrega)}</dd><dt>Condiciones</dt><dd>${esc(o.condiciones)}</dd><dt>Validez</dt><dd>${esc(o.validez)}</dd><dt>Aclaraciones</dt><dd>${arr(o.aclaraciones).map(esc).join("\n")}</dd></dl><div class="btns"><button class="btn sm primary" data-act="saveBudget">Guardar como borrador en la ficha</button></div></div>`;
  return `<section class="panel" id="out-${agent}" style="margin-top:16px"><div class="ph"><h2>${esc(agentName(agent))}: ${esc(r.label)}</h2><button class="link" data-act="clearOut" data-agent="${agent}">Cerrar</button></div><div class="out">${body}</div></section>`}
function postFromIdea(x,date){const p=blankPost();Object.assign(p,{title:x.titulo||"Idea",format:["carrusel","reel","post"].includes(x.formato)?x.formato:"post",objetivo:x.objetivo||"",audiencia:x.audiencia||"",
  caption:x.caption||"",cta:x.cta||"",slides:arr(x.slides).length?arr(x.slides).map(s=>({titulo:s.titulo||"",texto:s.texto||""})):[],guionReel:x.guion_reel||"",hashtags:x.hashtags||p.hashtags,
  notas:[x.gancho&&"Gancho: "+x.gancho,x.recursos&&"Recursos: "+x.recursos,x.justificacion&&"Justificación: "+x.justificacion,x.tema&&"Tema: "+x.tema].filter(Boolean).join("\n"),
  verificar:arr(x.afirmaciones_a_verificar),scheduledAt:date||"",source:"agente",history:[{stage:"idea",at:Date.now(),by:S.uid,note:"Propuesta del agente de contenido, guardada por vos"}]});return p}

  <div class="board"><div class="cols">${cols}</div></div>`}

async function loadMetrics(force){if(!mcp)return;S.metrics.state="loading";if(current==="panel")render();
  const to=todayAR(),fromD=new Date(Date.now()-90*864e5);const from=fmtAR.format(fromD).slice(0,10);
  try{const r=await mcp.callTool(MC,"getAnalyticsDataByMetrics",{brandId:String(S.settings.brandId),from:from+"T00:00:00-03:00",to:to+"T23:59:59-03:00",metrics:["IGPO02","IGPO03","IGPO06","IGPO07","IGPO14","IGPO12","IGPO15","IGPO27","IGPO28","IGPO29"]},force?{cache:{refresh:true}}:{cache:{staleTime:120000}});
    const rows=(r.payload&&r.payload.rows)||[];const num=v=>v===null||v===undefined||v===""?null:+v;
    S.metrics={state:"done",error:"",at:r.cache?.storedAt||Date.now(),rows:rows.map(x=>({date:x[0],dateLabel:x[0]?`${x[0].slice(6,8)}/${x[0].slice(4,6)}/${x[0].slice(0,4)}`:"",text:String(x[1]||""),url:x[2],type:({FEED_IMAGE:"Imagen",FEED_CAROUSEL_ALBUM:"Carrusel",REELS:"Reel",FEED_VIDEO:"Video"})[x[3]]||x[3]||"",reach:num(x[4]),interactions:num(x[5]),saved:num(x[6]),shares:num(x[7]),views:num(x[8]),follows:num(x[9])})).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}}
  catch(e){S.metrics.state="error";S.metrics.error=mcpMsg(e)}
  if(!editing&&!leadEditing)render()}
async function loadScheduled(){if(!mcp)return;S.scheduled.state="loading";
  const to=fmtAR.format(new Date(Date.now()+60*864e5)).slice(0,10);
  try{const r=await mcp.callTool(MC,"getScheduledPosts",{brandId:String(S.settings.brandId),fromDate:todayAR()+"T00:00:00-03:00",toDate:to+"T23:59:59-03:00",timezone:TZ},{cache:false});
    const list=arr(r.payload?.data);S.scheduled={state:"done",error:"",items:list.slice(0,6).map(p=>({text:String(p.text||p.title||"(sin texto)").slice(0,70),when:p.publicationDate?.dateTime?niceDate(p.publicationDate.dateTime.slice(0,16)):""}))}}
  catch(e){S.scheduled={state:"error",items:[],error:mcpMsg(e)}}
  if(!editing&&!leadEditing&&current==="panel")render()}
function mcpMsg(e){return({needs_reauth:"Volvé a conectar Metricool en claude.ai → Configuración → Conectores.",server_not_connected:"Agregá Metricool en claude.ai → Configuración → Conectores.",selection_required:"Elegí qué conexión de Metricool usar cuando claude.ai te lo pregunte.",not_in_manifest:"No autorizaste a la app a usar Metricool.",approval_required:"Falta tu permiso para usar Metricool.",server_unavailable:"Metricool no responde ahora. Probá en unos minutos.",tool_error:"Metricool devolvió un error: "+String(e?.message||"").slice(0,160)})[e?.code]||"No se pudo consultar Metricool ("+(e?.code||"error")+")."}
async function bestTime(){if(!mcp){toast("Metricool no está disponible");return}
  S.agentBusy.crecimiento="Consultando horarios en Metricool…";render();
  const from=todayAR(),to=fmtAR.format(new Date(Date.now()+6*864e5)).slice(0,10);
  try{const r=await mcp.callTool(MC,"getBestTimeToPostByNetwork",{brandId:String(S.settings.brandId),fromDate:from+"T00:00:00-03:00",toDate:to+"T23:59:59-03:00",timezone:TZ,socialNetwork:"instagram"});
    const days=["","lunes","martes","miércoles","jueves","viernes","sábado","domingo"];const slots=[];
    arr(r.payload?.data).forEach(d=>arr(d.bestTimesByHour).forEach(h=>slots.push({d:days[d.dayOfWeek]||d.dayOfWeek,h:h.hourOfDay,v:+h.value||0})));
    const top=slots.filter(s=>s.v>0).sort((a,b)=>b.v-a.v).slice(0,5);
    const out={observado:top.length?top.map(s=>`${s.d} a las ${String(s.h).padStart(2,"0")}:00 (valor ${s.v})`):["Metricool todavía no tiene datos suficientes de tu audiencia para recomendar horarios. Con más publicaciones y seguidores, este dato aparece."],hipotesis:[],recomendaciones:[],experimentos:[],datos_suficientes:top.length>0};
    S.agentOut.crecimiento={task:"analizar",label:"Mejores horarios según Metricool",out,extra:{}};await logRun("crecimiento","Mejores horarios (Metricool)",out.observado[0],out)}

function subscribe(col,key,order){const q=order?db.collection(col).orderBy("createdAt","desc").limit(order):db.collection(col);
  q.onSnapshot(s=>{S[key]=s.docs.map(d=>({...d.data(),id:d.id}));S.loaded[key]=true;
    render()},e=>{S.loaded[key]=true;render()})}
async function boot(){render();

  db=d;sample=sm;mcp=mc;user=us;
  S.caps.db=db?"ok":"off";S.caps.sample=sample?"ok":"off";S.caps.mcp=mcp?"ok":"off";
  if(user){try{S.uid=await user.id()}catch(e){}}
  if(db){db.doc("config/main").onSnapshot(s=>{S.settings={...DEFAULT_SETTINGS,...(s.exists?s.data():{})};S.loaded.settings=true;if(!$("#drawerRoot").innerHTML)render()},()=>{});
    subscribe("posts","posts");subscribe("reels","reels");subscribe("historias","historias");subscribe("alertas","alertas",80);subscribe("approvals","approvals");subscribe("runs","runs",60);subscribe("tasks","tasks")}
  else Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);
  if(mcp){try{const lt=await mcp.listTools(MC);const sv=lt.servers.find(x=>x.server===MC);if(!sv||!sv.tools.length&&sv.authStatus!=="unknown")S.caps.mcp="off";else if(sv.authStatus==="needs_reauth")S.caps.mcp="off"}catch(e){}
    render();if(S.caps.mcp==="ok"){loadMetrics(false);loadScheduled()}}
  else render()}
</script>

const BR={noche:"#17263B",marfil:"#F4F0E7",oro:"#D6BD86",oroOsc:"#8A6D2F",grisN:"#B7BFCC",grisM:"#5B6476"};

const PILOT_DEFAULT={activo:"si",pilares:"Alquileres: aumentos, índices y renovaciones\nQué revisar antes de firmar un contrato\nDerechos y obligaciones de propietarios e inquilinos\nDeudas y acuerdos de pago con trato digno\nPreguntas frecuentes de la comunidad",evitar:"Prometer resultados jurídicos\nAfirmar que hay un abogado matriculado firmando",cta:"Escribinos por WhatsApp al 2920 60-2681 o por mensaje privado",ritmo:"diario_historias",hora:"19:00"};
const pilot=()=>({...PILOT_DEFAULT,...(S.settings.piloto||{})});
async function brandFonts(){try{await Promise.all([document.fonts.load('600 96px "Cormorant Garamond"'),document.fonts.load('700 40px "Cormorant Garamond"'),document.fonts.load('500 40px Manrope'),document.fonts.load('700 22px Manrope')])}catch(e){}}
function wrapC(ctx,text,width){const lines=[];String(text||"").split("\n").forEach(par=>{let cur="";par.split(/\s+/).filter(Boolean).forEach(w=>{const t=(cur+" "+w).trim();if(ctx.measureText(t).width<=width)cur=t;else{if(cur)lines.push(cur);cur=w}});lines.push(cur)});return lines}
function fitC(ctx,text,fam,wt,width,maxH,start,min,lh){for(let s=start;s>=min;s-=4){ctx.font=`${wt} ${s}px ${fam}`;const L=wrapC(ctx,text,width);if(L.length*s*lh<=maxH)return{L,s}}ctx.font=`${wt} ${min}px ${fam}`;return{L:wrapC(ctx,text,width),s:min}}
function drawSlide(s,idx,total,W,H,user){const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const dark=(s.tema||(idx%2?"marfil":"noche"))==="noche";const bg=dark?BR.noche:BR.marfil,ink=dark?BR.marfil:BR.noche,muted=dark?BR.grisN:BR.grisM,oro=dark?BR.oro:BR.oroOsc;
  x.fillStyle=bg;x.fillRect(0,0,W,H);x.textBaseline="top";const M=96,width=W-2*M;
  x.fillStyle=ink;x.font=`700 40px ${SERIF}`;x.fillText("Cláusula Legal",M,M-8);x.fillStyle=oro;x.font=`700 17px ${SANS}`;x.fillText("DOCUMENTACIÓN CONTRACTUAL",M,M+40);
  if(total>1){x.fillStyle=muted;x.font=`600 24px ${SANS}`;const t=`${idx+1} / ${total}`;x.fillText(t,W-M-x.measureText(t).width,M)}
  const bottom=H-M-70;let body={L:[],s:0};if(s.texto)body=fitC(x,s.texto,SANS,500,width,H*0.30,40,28,1.45);const bodyH=body.L.length*body.s*1.45;
  const tt=fitC(x,s.titulo||"",SERIF,600,width,H*(s.texto?0.42:0.6),H>1500?(idx===0?124:110):(idx===0?112:96),56,1.06);const titleH=tt.L.length*tt.s*1.06;
  let y=bottom-bodyH-(body.L.length?48:0)-titleH-70;if(s.kicker){x.fillStyle=oro;x.font=`700 22px ${SANS}`;x.fillText(String(s.kicker).toUpperCase(),M,y)}y+=52;
  x.fillStyle=ink;x.font=`600 ${tt.s}px ${SERIF}`;tt.L.forEach(l=>{x.fillText(l,M,y);y+=tt.s*1.06});y+=20;x.fillStyle=oro;x.fillRect(M,y,90,3);y+=28;
  x.fillStyle=dark?BR.marfil:BR.noche;x.font=`500 ${body.s}px ${SANS}`;body.L.forEach(l=>{x.fillText(l,M,y);y+=body.s*1.45});
  x.fillStyle=muted;x.font=`600 22px ${SANS}`;x.fillText("@"+user,M,H-M-10);if(total>1&&idx<total-1){x.fillStyle=oro;const a="Deslizá  →";x.fillText(a,W-M-x.measureText(a).width,H-M-10)}
  return new Promise(r=>cv.toBlob(b=>r(b),"image/png"))}
function slidesOf(p){const sl=(p.slides||[]).filter(s=>(s.titulo||"").trim()||(s.texto||"").trim());if(sl.length)return sl.map((s,i)=>({...s,kicker:s.kicker||(i===0?(p.objetivo?"":"Cláusula Legal"):"")}));
  return[{kicker:"Cláusula Legal",titulo:p.title||"",texto:(p.caption||"").split("\n")[0].slice(0,200)}]}
async function genImages(p,kind){if(!assetsCap){toast("Esta vista no puede guardar imágenes");return null}await brandFonts();const user=S.settings.igUser||"clausuladigitall";
  const list=kind==="historias"?(p.historias||[]):slidesOf(p);if(!list.length){toast(kind==="historias"?"Esta pieza no tiene historias":"Agregá diapositivas o texto primero");return null}
  const H=kind==="historias"?1920:1350;const out=[];
  for(let i=0;i<list.length;i++){const b=await drawSlide(list[i],i,kind==="historias"?1:list.length,1080,H,user);const r=await assetsCap.upload(b);out.push({id:r.id,url:r.url})}return out}
async function zipAndSave(items,name){if(!downloads||typeof JSZip==="undefined"){toast("La descarga no está disponible en esta vista");return}
  const z=new JSZip();for(let i=0;i<items.length;i++){const b=await (await fetch(items[i].url)).blob();z.file(`${String(i+1).padStart(2,"0")}.png`,b)}
  const blob=await z.generateAsync({type:"blob"});try{await downloads.save({filename:name+".zip",data:blob});toast("Imágenes listas")}catch(e){toast(e?.code==="declined"?"Descarga cancelada":"No se pudo descargar")}}
async function saveOne(url,name){if(!downloads){toast("La descarga no está disponible en esta vista");return}const b=await (await fetch(url)).blob();try{await downloads.save({filename:name+".png",data:b})}catch(e){if(e?.code!=="declined")toast("No se pudo descargar")}}
function imagesBlock(p){const im=p.imagenes||[],hs=p.historiasImg||[];
  return `<div class="panel" style="padding:14px"><div class="ph"><h3>Imágenes con la plantilla de marca</h3>${p.source==="piloto"?`<span class="chip gold">Piloto automático</span>`:""}</div>
  ${im.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px">${im.map((x,i)=>`<button class="card" style="padding:0;overflow:hidden" data-mact="one" data-url="${esc(x.url)}" data-n="${i+1}" aria-label="Descargar imagen ${i+1}"><img src="${esc(x.url)}" alt="Diapositiva ${i+1}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block"></button>`).join("")}</div>`:`<span class="small muted">Todavía no hay imágenes. Se generan con el título y texto de cada diapositiva.</span>`}
  ${hs.length?`<b class="small">Historias</b><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px">${hs.map((x,i)=>`<button class="card" style="padding:0;overflow:hidden" data-mact="one" data-url="${esc(x.url)}" data-n="historia-${i+1}" aria-label="Descargar historia ${i+1}"><img src="${esc(x.url)}" alt="Historia ${i+1}" style="width:100%;aspect-ratio:9/16;object-fit:cover;display:block"></button>`).join("")}</div>`:""}
  <div class="btns">${p._new?`<span class="small muted">Guardá la pieza para generar sus imágenes.</span>`:`<button class="btn sm primary" data-mact="gen">${im.length?"Regenerar imágenes":"Generar imágenes"}</button>${(p.historias||[]).length?`<button class="btn sm" data-mact="genH">${hs.length?"Regenerar historias":"Generar historias"}</button>`:""}${im.length||hs.length?`<button class="btn sm" data-mact="zip">Descargar todo (zip)</button>`:""}${p.stage==="aprobado"||p.stage==="revision"?`<button class="btn sm" data-mact="manual">Ya la programé en Metricool</button>`:""}`}</div>
  ${(p.historias||[]).length?`<details><summary>Texto de las historias (${p.historias.length})</summary><ol class="small" style="margin:6px 0 0;padding-left:18px">${p.historias.map(h=>`<li><b>${esc(h.titulo)}</b> ${esc(h.texto||"")}</li>`).join("")}</ol></details>`:""}
  <span class="small muted">Tocá una imagen para descargarla sola. Para publicar: descargá, abrí Metricool o Instagram, pegá el texto con “Copiar texto y hashtags”.</span></div>`}
function pilotAlerts(){const hoy=todayAR();return S.posts.filter(p=>p.source==="piloto"&&p.stage==="revision"&&(p.scheduledAt||"").startsWith(hoy)).map(p=>`<div class="row"><span class="t">Pieza del día lista: ${esc(p.title)}</span><button class="link" data-act="openPost" data-id="${esc(p.id)}">Revisar y publicar</button></div>`)}
function pilotPanel(){const c=pilot();const piezas=S.posts.filter(p=>p.source==="piloto").sort(byNewest).slice(0,5);const runs=S.runs.filter(r=>r.agent==="piloto").slice(0,3);
  return `<section class="panel" style="border-color:var(--oro)"><div class="ph"><h2>Piloto automático de Instagram</h2><span class="chip ${c.activo==="si"?"ok":""}">${c.activo==="si"?"Activo":"En pausa"}</span></div>
  <p class="small muted" style="margin:0">Todos los días a la mañana prepara la pieza del día con sus imágenes y 2 historias, verifica las afirmaciones jurídicas en fuentes oficiales, la deja en el Estudio y te avisa al celular. Vos revisás, descargás y programás en Metricool.</p>
  <div class="fields"><label for="plAct">Estado<select id="plAct">${opts([["si","Activo"],["no","En pausa"]],c.activo)}</select></label><label for="plHora">Hora de publicación sugerida<input id="plHora" type="time" value="${esc(c.hora)}"></label><label for="plRitmo">Ritmo<select id="plRitmo">${opts([["diario_historias","1 por día (lun a sáb) + 2 historias"],["diario","1 por día (lun a sáb)"],["cuatro","4 por semana"]],c.ritmo)}</select></label></div>
  <div class="fields"><label for="plPil">Pilares de contenido (uno por línea)<textarea id="plPil" style="min-height:110px">${esc(c.pilares)}</textarea></label><label for="plEv">Nunca hacer (uno por línea)<textarea id="plEv" style="min-height:110px">${esc(c.evitar)}</textarea></label></div>
  <label for="plCta">Llamada a la acción principal<input id="plCta" value="${esc(c.cta)}"></label>
  <button class="btn sm primary" data-mact="savePilot" style="align-self:flex-start">Guardar configuración</button>
  <h3>Últimas piezas del piloto</h3><div class="list">${piezas.map(p=>`<div class="row"><button class="link t" style="text-align:left;color:var(--ink)" data-act="openPost" data-id="${esc(p.id)}">${esc(p.title)}</button>${stageChip(p.stage)}</div>`).join("")||`<div class="empty">Todavía no corrió. La primera pieza aparece mañana a la mañana.</div>`}</div>
  ${runs.length?`<div class="small muted">Última ejecución: ${esc(runs[0].summary)} · ${ago(runs[0].createdAt)}</div>`:""}</section>`}
document.addEventListener("click",async ev=>{const el=ev.target.closest("[data-mact]");if(!el)return;const k=el.dataset.mact;
  try{switch(k){
  case"gen":case"genH":{if(!editing)break;readPostForm();await savePost();el.disabled=true;el.textContent="Generando…";const imgs=await genImages(editing,k==="genH"?"historias":"feed");if(imgs){const f=k==="genH"?"historiasImg":"imagenes";await dbUpdate("posts/"+editing.id,{[f]:imgs});editing[f]=imgs;toast("Imágenes listas")}drawPost();break}
  case"zip":{const p=editing;await zipAndSave([...(p.imagenes||[]),...(p.historiasImg||[])],"Instagram "+(p.title||"pieza").replace(/[\\/:*?"<>|]+/g," ").slice(0,60));break}
  case"one":await saveOne(el.dataset.url,`${(editing?.title||"pieza").replace(/[\\/:*?"<>|]+/g," ").slice(0,50)} ${el.dataset.n}`);break;
  case"manual":{readPostForm();editing.stage="programado";editing.notas=(editing.notas?editing.notas+"\n":"")+"Programada a mano en Metricool";await savePost();toast("Marcada como programada. Cuando salga, usá “Verificar publicación”.");break}
  case"savePilot":await saveSettings({piloto:{...pilot(),activo:$("#plAct").value,hora:$("#plHora").value||"19:00",ritmo:$("#plRitmo").value,pilares:$("#plPil").value,evitar:$("#plEv").value,cta:$("#plCta").value}});toast("Configuración del piloto guardada");break;
  }}catch(e){if(e?.message!=="no-db"){console.error(e);toast("No se pudo completar la acción")}}});

<script>
"use strict";
/* ============ Instagram: Publicaciones, Reels, Historias y Director ============ */
let downloads=null;claude.use("downloads").then(d=>{downloads=d}).catch(()=>{});
S.reels=[];S.historias=[];S.alertas=[];Object.assign(S.loaded,{reels:false,historias:false,alertas:false});
const dia=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
const gp=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
function sp(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(typeof a[k]!=="object"||a[k]===null)a[k]={};a=a[k]});a[ks.at(-1)]=v}
const STUDY=`Lo que hoy hace crecer un reel (estudio interno): Instagram confirmó que sus señales principales son tiempo de visualización, me gusta y envíos por mensaje directo (los envíos pesan algo más para llegar a no seguidores). El reel se muestra primero a un grupo chico y se expande si lo miran hasta el final o lo envían. El gancho tiene que plantear en los primeros 2 segundos un problema que la persona reconoce como propio, dicho y escrito en pantalla. Duración ideal 45 a 60 segundos. Subtítulos desde la primera palabra. Contenido original, sin marcas de agua. Cierre que pida enviarlo ("mandáselo a quien…") y una palabra clave para comentar. En temas legales funcionan explicaciones de un minuto de problemas cotidianos con una voz reconocible.`;

/* ---------- Publicaciones ---------- */
function vPublicaciones(){const list=S.posts.filter(p=>["post","carrusel"].includes(p.format||"post"));
  const groups=STAGES.map(([k,l])=>{const items=list.filter(p=>(p.stage||"idea")===k).sort((a,b)=>(a.scheduledAt||"9").localeCompare(b.scheduledAt||"9")||byNewest(a,b));
    return `<div class="col"><h3><span>${esc(l)}</span><span>${items.length}</span></h3>${items.map(p=>`<button class="card" data-act="openPost" data-id="${esc(p.id)}">${(p.imagenes||[])[0]?`<img src="${esc(p.imagenes[0].url)}" alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:5px">`:""}<b>${esc(p.title||"Sin título")}</b><span class="meta"><span class="chip">${esc(fmtLabel(p.format))}</span>${p.scheduledAt?`<span>${niceDate(p.scheduledAt)}</span>`:""}${p.source==="piloto"?`<span class="chip gold">Piloto</span>`:p.source==="triptico"?`<span class="chip gold">Tríptico</span>`:""}</span></button>`).join("")}</div>`}).join("");
  return `<div class="head"><div><div class="eyebrow">Sección 1 · Feed</div><h1>Publicaciones</h1><p>Carruseles y publicaciones con imagen, de la idea a la publicación. El carrusel es el formato que más se guarda: ideal para contenido útil.</p></div>
  <div class="btns"><button class="btn primary" data-act="newPost">Nueva publicación</button></div></div>
  ${agentCard("contenido",AGENTS.contenido)}
  ${S.agentOut.contenido?outBlock("contenido"):""}
  <div class="board"><div class="cols">${groups}</div></div>`}

/* ---------- Reels ---------- */
const R_FORMATOS=[["articulo","El artículo en 60 segundos"],["resaltador","El resaltador en la mesa"],["respondo","Respondo tu pregunta"],["personajes","Serie animada"],["otro","Otro"]];
const R_ESTADOS=[["idea","Idea"],["guion","Guion"],["grabar","Para grabar"],["editar","En edición"],["revision","En revisión"],["listo","Aprobado"],["publicado","Publicado"]];
const R_CHIP={revision:"warn",listo:"info",publicado:"ok",grabar:"gold"};
const T1=[["1","9 y 961","Lo que no dice tu contrato también te obliga"],["2","10","Tener un derecho no te da permiso para todo"],["3","11","Cuando el más grande impone las reglas"],["4","265 a 270","Firmé creyendo otra cosa"],["5","271 a 275","Te lo escondieron a propósito"],["6","332","Aprovecharse de la necesidad tiene nombre"],["7","957 a 959","Firmaste: ahora es ley entre ustedes"],["8","984 a 989","La letra chica que no vale"],["9","1059 y 1060","La seña: ¿la perdés o te la devuelven doble?"],["10","1086 a 1088","Si no cumplís, se termina"]];
const R_FMT_GUIDE={articulo:"Voz en off del responsable sobre imágenes simples y texto grande en pantalla; un artículo del Código Civil y Comercial explicado con un caso cotidiano argentino.",resaltador:"Filmado desde arriba con el celular: la mano del responsable, un contrato impreso real y un resaltador amarillo que marca la cláusula trampa mientras explica. Las escenas deben describir qué hace la mano y qué se resalta.",respondo:"Pregunta real de un seguidor en pantalla y respuesta directa en 45 segundos.",personajes:"Serie animada con Cláusula (un resaltador amarillo mentor) y El Contrato (hojas plegadas que sufren los conflictos) sobre un escritorio de madera con lámpara de bronce.",otro:""};
let reelEditing=null, reelBusy="";
const rLabel=(L,k)=>(L.find(x=>x[0]===k)||[k,k])[1];
function blankReel(){return{id:newId("reel"),titulo:"",formato:"articulo",estado:"idea",episodio:"",articulos:"",gancho:"",bloques:[{tiempo:"0-3 s",pantalla:"",voz:""}],musica:"",cta:"",palabraClave:"",caption:"",hashtags:"#ClausulaLegal #CodigoCivil #Contratos",scheduledAt:"",notas:"",verificar:[],createdAt:Date.now(),source:"manual"}}
const vozTotal=r=>(r.bloques||[]).map(b=>b.voz||"").join(" ").trim();
const segs=r=>Math.round((vozTotal(r).split(/\s+/).filter(Boolean).length)/2.6);
function reelChecks(r){const c=[];const s=segs(r);const g=(r.gancho||"").trim();
  c.push([g&&g.split(/\s+/).length<=14?"ok":"warn",g?`Gancho de ${g.split(/\s+/).length} palabras${g.split(/\s+/).length>14?": acortalo para que entre en 2 segundos":""}`:"Falta el gancho de los primeros 2 segundos"]);
  c.push([s>=25&&s<=75?"ok":"warn",s?`Duración estimada de la voz: ${s} segundos${s>75?" (larga: apuntá a 45 a 60)":s<25?" (corta)":""}`:"Todavía no hay voz en off"]);
  c.push([/mand[aá]|envi[aá]|compart/i.test((r.cta||"")+vozTotal(r))?"ok":"warn","Pide enviarlo a alguien (la señal que más alcance da)"]);
  c.push([r.palabraClave?"ok":"warn",r.palabraClave?`Palabra clave: ${r.palabraClave}`:"Falta la palabra clave para comentar"]);
  if((r.verificar||[]).length)c.push(["warn",`${r.verificar.length} afirmaciones para verificar antes de grabar`]);
  if(/abogad[oa]\s+matriculad|soy\s+abogad/i.test(vozTotal(r)+(r.caption||"")))c.push(["bad","Menciona una matrícula que todavía no tenés"]);
  return c}
function vReels(){const groups=R_ESTADOS.map(([k,l])=>{const items=S.reels.filter(r=>(r.estado||"idea")===k).sort(byNewest);

  return `<div class="head"><div><div class="eyebrow">Sección 2 · Alcance</div><h1>Reels</h1><p>Guiones por bloques con voz en off, listos para grabar con el teleprompter. Cada reel se controla contra lo que hoy hace crecer un video: gancho, retención, envíos y palabra clave.</p></div>
  <div class="btns"><button class="btn" data-ract="new">Nuevo reel en blanco</button></div></div>
  <section class="panel" style="border-color:var(--oro)"><div class="ph"><h2>Agente de reels</h2><span class="tag" style="font-family:var(--f-mono);font-size:11px;color:var(--oro-ink)">REELS</span></div>
   <p class="small muted" style="margin:0">Escribe el guion completo: gancho, bloques de 10 segundos con lo que se ve y la voz en off, música, cierre y texto de la publicación.</p>
   <div class="fields"><label for="rfFmt">Formato<select id="rfFmt">${opts(R_FORMATOS.slice(0,4),"articulo")}</select></label><label for="rfEp">Episodio de la serie del Código<select id="rfEp"><option value="">Ninguno</option>${T1.map(([n,a,t])=>`<option value="${n}">Ep. ${n} · arts. ${esc(a)} · ${esc(t)}</option>`).join("")}</select></label></div>
   <label for="rfTema">Tema o pregunta (opcional si elegiste episodio)<input id="rfTema" placeholder="Ej.: ¿me pueden pedir 3 meses de depósito?"></label>
   <button class="btn primary" data-ract="agent" ${reelBusy?"disabled":""} style="align-self:flex-start">Escribir guion</button>${reelBusy?`<div class="status"><span class="spin"></span>${esc(reelBusy)}</div>`:""}</section>
  ${S.loaded.reels&&!S.reels.length?`<div class="empty">Todavía no hay reels. Empezá por el Episodio 1 de la serie o por una pregunta frecuente.</div>`:""}
  <div class="board"><div class="cols">${groups}</div></div>`}
function RF(path,label,o={}){const v=gp(reelEditing,path)??"";const id="rf-"+path.replace(/\./g,"-");
  if(o.select)return `<label for="${id}">${esc(label)}<select id="${id}" data-rp="${esc(path)}">${o.select.map(([k,l])=>`<option value="${esc(k)}"${String(v)===k?" selected":""}>${esc(l)}</option>`).join("")}</select></label>`;

  </div>

  ${agentCard("crecimiento",AGENTS.crecimiento)}
  ${S.agentOut.crecimiento?outBlock("crecimiento"):""}`}
async function directorAnalyze(){if(!sample){toast("Los agentes no están disponibles en esta vista");return}dirBusy="Leyendo métricas y el trabajo de los agentes…";render();
  if(S.caps.mcp==="ok")await loadMetrics(true);

  const prod={publicaciones:S.posts.map(p=>({t:p.title,etapa:p.stage,formato:p.format,fecha:p.scheduledAt})).slice(0,30),reels:S.reels.map(r=>({t:r.titulo,estado:r.estado,formato:r.formato,ep:r.episodio,seg:segs(r)})).slice(0,30),historias:S.historias.map(h=>({fecha:h.fecha,estado:h.estado,n:(h.frames||[]).length})).slice(0,20),agentes:S.runs.slice(0,15).map(r=>({agente:r.agent,tarea:r.task,resumen:r.summary})),novedades:S.alertas.filter(a=>a.origen==="web").slice(0,8).map(a=>({titulo:a.titulo,detalle:a.detalle}))};
  dirBusy="Pensando recomendaciones…";render();

    const now=Date.now();for(const [i,a] of arr(o.alertas).entries()){const id="al-"+now.toString(36)+i;await dbSet("alertas/"+id,{id,tipo:a.tipo==="alerta"?"alerta":"recomendacion",titulo:a.titulo||"",detalle:a.detalle||"",prioridad:a.prioridad||"media",origen:"analisis",leida:false,createdAt:now+i})}
    await logRun("director","Análisis de la cuenta",o.resumen||"",o);toast("Análisis listo")}
  catch(e){if(e?.code!=="cancelled"&&e?.message!=="no-db")toast(sampleMsg(e))}finally{dirBusy="";render()}}
document.addEventListener("click",async ev=>{const el=ev.target.closest("[data-dact]");if(!el)return;const k=el.dataset.dact;

<script>
/* ============ Sala de reels: ver, aprobar o dejar en espera, y preparar la publicación ============ */
VIEWS.splice(1,0,["sala","Sala de reels"]);SHORT.sala="Sala";
const SALA_TABS=[["revision","Para revisar"],["espera","En espera"],["aprobado","Aprobados"],["programado","Programados"],["publicado","Publicados"]];
let salaTab="revision",salaPrep=null,salaHold=null,salaConfirm=null;
const salaOf=r=>r.sala||(r.estado==="publicado"?"publicado":r.estado==="listo"?"aprobado":"revision");
const salaReels=()=>(S.reels||[]).filter(r=>r.video&&r.video.url);
function salaCount(k){return salaReels().filter(r=>salaOf(r)===k).length}
function vSala(){const list=salaReels().filter(r=>salaOf(r)===salaTab).sort((a,b)=>(a.orden||99)-(b.orden||99)||byNewest(a,b));
  return `<div class="head"><div><div class="eyebrow">Tus reels terminados</div><h1>Sala de reels</h1><p>Miralos como en Instagram. Aprobá los que salen, dejá en espera los que pueden mejorar. Nada se publica sin que lo confirmes.</p></div></div>
  <div class="salatabs" role="tablist">${SALA_TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===salaTab}" class="${k===salaTab?"on":""}" data-sact="tab" data-k="${k}">${esc(l)}<span>${salaCount(k)}</span></button>`).join("")}</div>
  ${S.loaded.reels&&!list.length?`<div class="empty">${salaTab==="revision"?"No hay reels esperando tu revisión. Cuando los agentes terminen uno, aparece acá.":"No hay reels en esta lista."}</div>`:""}
  <div class="salafeed">${list.map(salaCard).join("")}</div>`}
function salaCard(r){const st=salaOf(r);const prep=salaPrep===r.id,hold=salaHold===r.id;
  return `<article class="salacard" id="sala-${esc(r.id)}">
  <div class="salavid"><video src="${esc(r.video.url)}" ${r.portada?`poster="${esc(r.portada)}"`:""} controls playsinline preload="metadata"></video></div>
  <div class="salainfo">
    <div class="eyebrow">${r.episodio?"Episodio "+esc(r.episodio)+" · ":""}${r.articulos?"Art. "+esc(r.articulos):""}${r.video.dur?" · "+esc(r.video.dur)+" s":""}</div>
    <h2>${esc(r.titulo||"Reel")}</h2>
    ${r.gancho?`<p class="salahook">“${esc(r.gancho)}”</p>`:""}
    ${st==="espera"&&r.notaEspera?`<div class="salanote"><b>Qué mejorar:</b> ${esc(r.notaEspera)}</div>`:""}
    ${(r.verificar||[]).length?`<div class="salanote warn"><b>Revisar antes de publicar:</b> ${r.verificar.map(esc).join(" · ")}</div>`:""}
    ${st==="revision"||st==="espera"?`<div class="btns"><button class="btn primary big" data-sact="aprobar" data-id="${esc(r.id)}">Aprobar</button><button class="btn big" data-sact="espera" data-id="${esc(r.id)}">${st==="espera"?"Cambiar nota":"En espera"}</button></div>`:""}
    ${hold?`<div class="salabox"><label for="hold-${esc(r.id)}">¿Qué querés que mejore?</label><textarea id="hold-${esc(r.id)}" rows="3" placeholder="Ej.: el gancho no engancha, la voz va muy rápido, otra situación de ejemplo…">${esc(r.notaEspera||"")}</textarea><div class="btns"><button class="btn primary" data-sact="guardarEspera" data-id="${esc(r.id)}">Dejar en espera</button><button class="btn" data-sact="cerrar">Cancelar</button></div></div>`:""}
    ${st==="aprobado"&&!prep?`<div class="btns"><button class="btn primary big" data-sact="preparar" data-id="${esc(r.id)}">Preparar publicación</button><button class="btn" data-sact="volver" data-id="${esc(r.id)}">Volver a revisión</button></div>`:""}
    ${prep?salaSteps(r):""}
    ${st==="programado"?`<div class="salanote">Programado para ${esc(niceDate(r.scheduledAt||""))}${r.plannerUrl?` · <a class="link" href="${esc(r.plannerUrl)}" target="_blank" rel="noopener">Ver en Metricool</a>`:""}</div>`:""}
    ${st==="programado"||st==="aprobado"?`<button class="link" data-sact="publicado" data-id="${esc(r.id)}">Marcar como publicado</button>`:""}
    <button class="link" data-sact="guion" data-id="${esc(r.id)}">Ver guion</button>
  </div></article>`}
function salaSteps(r){const cap=(r.caption||"")+(r.hashtags?"\n\n"+r.hashtags:"");const okM=S.caps.mcp==="ok";const conf=salaConfirm===r.id;
  return `<ol class="salasteps">
  <li><b>Revisá el texto</b><textarea id="cap-${esc(r.id)}" rows="6">${esc(cap)}</textarea><div class="btns"><button class="btn sm" data-sact="guardarCap" data-id="${esc(r.id)}">Guardar texto</button><button class="btn sm" data-sact="copiar" data-id="${esc(r.id)}">Copiar</button></div></li>
  <li><b>Bajá el video</b><a class="btn sm" href="${esc(r.video.url)}" download="${esc((r.titulo||"reel").replace(/[^\wáéíóúñ -]/gi,"").slice(0,40))}.mp4">Descargar video</a></li>
  <li><b>Publicalo</b>
    <div class="salaopts"><div><span class="small">Opción A · desde tu celular</span><p class="small muted">Abrí Instagram, tocá +, elegí Reel, cargá el video descargado y pegá el texto copiado.</p></div>
    <div><span class="small">Opción B · programarlo con Metricool</span><label for="when-${esc(r.id)}" class="small">Fecha y hora (Argentina)</label><input type="datetime-local" id="when-${esc(r.id)}" value="${esc(r.scheduledAt||"")}">
      ${conf?`<div class="salanote warn">Vas a programar este reel en @${esc(S.settings.igUser)} para ${esc(niceDate(r.scheduledAt))}. Saldrá en tu perfil público a esa hora, salvo que lo canceles en Metricool antes. <div class="btns"><button class="btn primary" data-sact="programar" data-id="${esc(r.id)}">Sí, programar</button><button class="btn" data-sact="cerrar">No</button></div></div>`
      :`<button class="btn sm" data-sact="pedirProgramar" data-id="${esc(r.id)}" ${okM?"":"disabled"}>Programar…</button>${okM?"":`<span class="small" style="color:var(--warn)">Metricool no está disponible en esta vista.</span>`}`}</div></div></li></ol>`}
async function salaSet(id,patch){await dbUpdate("reels/"+id,{...patch,updatedAt:Date.now()})}
document.addEventListener("click",async e=>{const el=e.target.closest("[data-sact]");if(!el)return;const id=el.dataset.id,a=el.dataset.sact;const r=id&&S.reels.find(x=>x.id===id);
  switch(a){
  case"tab":salaTab=el.dataset.k;salaPrep=salaHold=salaConfirm=null;render.keep=false;render();break;
  case"aprobar":await salaSet(id,{sala:"aprobado",estado:"listo",aprobadoAt:Date.now(),aprobadoPor:S.uid||null});salaPrep=id;toast("Reel aprobado. Ya podés preparar la publicación");render();break;
  case"espera":salaHold=id;render();break;
  case"guardarEspera":{const t=$("#hold-"+id).value.trim();await salaSet(id,{sala:"espera",notaEspera:t});salaHold=null;toast("Quedó en espera"+(t?" con tu nota para los agentes":""));render();break}
  case"cerrar":salaHold=salaConfirm=null;render();break;
  case"preparar":salaPrep=id;render();break;
  case"volver":await salaSet(id,{sala:"revision",estado:"revision"});salaPrep=null;render();break;
  case"guardarCap":{const v=$("#cap-"+id).value;const i=v.lastIndexOf("\n\n#");const cap=i>=0?v.slice(0,i):v,hs=i>=0?v.slice(i+2):"";await salaSet(id,{caption:cap,hashtags:hs});toast("Texto guardado");break}
  case"copiar":try{await navigator.clipboard.writeText($("#cap-"+id).value);toast("Texto copiado")}catch(_){toast("No se pudo copiar: seleccioná el texto y copialo a mano")}break;
  case"pedirProgramar":{const w=$("#when-"+id).value;if(!w){toast("Elegí fecha y hora");break}if(w<=nowAR()){toast("Esa fecha ya pasó");break}await salaSet(id,{scheduledAt:w});salaConfirm=id;render();break}
  case"programar":await salaSchedule(r);break;
  case"publicado":await salaSet(id,{sala:"publicado",estado:"publicado",publishedAt:Date.now()});toast("Marcado como publicado");render();break;
  case"guion":openReel(id);break}});
async function salaSchedule(r){if(!r)return;salaConfirm=null;
  const apId=newId("apr");await dbSet("approvals/"+apId,{id:apId,titulo:"Reel: "+(r.titulo||""),que:"Programar el reel en Metricool",cuenta:"@"+S.settings.igUser,cuando:niceDate(r.scheduledAt),contenido:(r.caption||"").slice(0,300),media:[r.video.url],status:"ejecutando",reelId:r.id,createdAt:Date.now(),decidedAt:Date.now(),decidedBy:S.uid||null,consecuencias:"Saldrá publicado en el perfil público a esa hora."});
  const info={autoPublish:true,draft:false,descendants:[],firstCommentText:"",hasNotReadNotes:false,media:[r.video.url],mediaAltText:[],providers:[{network:"instagram"}],
    publicationDate:{dateTime:r.scheduledAt+":00",timezone:TZ},shortener:false,smartLinkData:{ids:[]},instagramData:{type:"REEL",showReelOnFeed:true,isAiGenerated:true},text:(r.caption||"")+(r.hashtags?"\n\n"+r.hashtags:"")};
  try{const res=await mcp.callTool(MC,"createScheduledPost",{blogId:String(S.settings.brandId),date:r.scheduledAt+":00-03:00",info:JSON.stringify(info)});const url=findKey(res.payload,"plannerUrl");
    await dbUpdate("approvals/"+apId,{status:"ejecutada",resultado:"Reel programado en Metricool",plannerUrl:url||null});await salaSet(r.id,{sala:"programado",plannerUrl:url||null});salaPrep=null;toast("Reel programado en Metricool")}

    await dbUpdate("approvals/"+apId,{status:amb?"incierta":"fallida",resultado:msg});toast(msg)}

<script>
"use strict";
/* ============ Mejoras: tablero de temporada, semana en Instagram y menú del celular ============ */
/* --- Tablero de la temporada: cada episodio con su avance --- */
const T_PASOS=[["guion","Guion"],["voces","Voces"],["video","Video"],["revision","Revisión"],["publicado","Publicado"]];
function pasoDe(r){const pub=r.estado==="publicado"||r.sala==="publicado";const apr=pub||["aprobado","programado"].includes(r.sala);const vid=!!(r.video&&r.video.url);
  const voc=vid||r.voces===true;const gui=voc||!!(r.guion||r.bloques||r.guionTexto||(r.escenas&&r.escenas.length));
  return {guion:gui,voces:voc,video:vid&&!r.borrador,revision:apr,publicado:pub}}
function temporadaBoard(){const all=(S.reels||[]).filter(r=>r.episodio);const eps=all.filter(r=>r.orden||!all.some(o=>o!==r&&o.orden&&String(o.episodio)===String(r.episodio))).sort((a,b)=>(+(a.orden||a.episodio)||99)-(+(b.orden||b.episodio)||99));
  if(!eps.length)return"";
  const done=eps.filter(r=>pasoDe(r).publicado).length;
  return `<section class="panel tboard"><div class="ph"><h2>Temporada 1</h2><span class="small muted">${done} de ${eps.length} ${eps.length===1?"episodio publicado":"episodios publicados"}</span></div>
  <div class="tlist">${eps.map(r=>{const p=pasoDe(r);const next=T_PASOS.find(([k])=>!p[k]);
    return `<button class="trow" data-sact="${r.video&&r.video.url?"verEp":"guion"}" data-id="${esc(r.id)}"><span class="tep">Ep. ${esc(r.episodio)}</span><span class="tti"><b>${esc(r.titulo||"Sin título")}</b><span>${r.articulos?"Art. "+esc(r.articulos)+" · ":""}${next?"Falta: "+esc(next[1].toLowerCase()):"Completo"}</span></span>
    <span class="tsteps" aria-label="Avance">${T_PASOS.map(([k,l])=>`<i class="${p[k]?"on":next&&next[0]===k?"now":""}" title="${esc(l)}"></i>`).join("")}</span></button>`}).join("")}</div>
  <div class="tleg">Barras, en orden: guion · voces · video · revisión · publicado</div></section>`}
document.addEventListener("click",e=>{const el=e.target.closest('[data-sact="verEp"]');if(!el)return;e.stopImmediatePropagation();
  const r=(S.reels||[]).find(x=>x.id===el.dataset.id);if(!r)return;salaTab=salaOf(r);render();setTimeout(()=>document.getElementById("sala-"+r.id)?.scrollIntoView({behavior:"smooth",block:"start"}),60)},true);
const _vSala=vSala;vSala=()=>{const h=_vSala();const i=h.indexOf(`<div class="salatabs"`);return i<0?h:h.slice(0,i)+temporadaBoard()+h.slice(i)};

/* --- La semana en Instagram: publicaciones, reels e historias por día --- */
function addDaysAR(d,n){const x=new Date(d+"T12:00:00-03:00");x.setDate(x.getDate()+n);return fmtAR.format(x).slice(0,10)}
function semanaIG(){const t=todayAR();const dias=[...Array(7)].map((_,i)=>addDaysAR(t,i));const ev=[];
  S.posts.filter(p=>p.scheduledAt).forEach(p=>ev.push({f:p.scheduledAt.slice(0,10),h:p.scheduledAt.slice(11,16),k:fmtLabel(p.format),t:p.title||"Sin título",st:p.stage,attr:`data-act="openPost" data-id="${esc(p.id)}"`}));
  (S.reels||[]).filter(r=>r.scheduledAt).forEach(r=>ev.push({f:r.scheduledAt.slice(0,10),h:r.scheduledAt.slice(11,16),k:"Reel",t:r.titulo||"Reel",st:r.sala||r.estado,attr:`data-ract="open" data-id="${esc(r.id)}"`}));
  (S.historias||[]).filter(x=>x.fecha).forEach(x=>ev.push({f:String(x.fecha).slice(0,10),h:"",k:"Historia",t:x.titulo||x.tema||"Historia",st:x.estado,attr:`href="#historias"`}));
  const n=ev.filter(x=>dias.includes(x.f)).length;
  return `<section class="panel" style="grid-column:1/-1"><div class="ph"><h2>Esta semana en Instagram</h2><span class="small muted">${n?n+(n===1?" pieza con fecha":" piezas con fecha"):"Sin piezas con fecha"}</span></div>
  <div class="week">${dias.map((d,i)=>{const its=ev.filter(x=>x.f===d).sort((a,b)=>a.h.localeCompare(b.h));const lab=i===0?"Hoy":new Date(d+"T12:00:00-03:00").toLocaleDateString("es-AR",{timeZone:TZ,weekday:"short",day:"numeric"});

/* --- Controles antes de publicar (Sala de reels) --- */
function capChecks(v){const w=[];const tags=(v.match(/#[\wáéíóúñü]+/gi)||[]);
  if(v.length>2200)w.push(["bad",`El texto tiene ${v.length} caracteres: Instagram permite hasta 2.200.`]);
  if(tags.length>30)w.push(["bad",`Hay ${tags.length} hashtags: Instagram permite hasta 30.`]);else if(tags.length>8)w.push(["warn",`${tags.length} hashtags: con 3 a 8 bien elegidos alcanza.`]);

document.addEventListener("input",e=>{const t=e.target;if(!t.id||!t.id.startsWith("cap-"))return;const c=t.parentElement.querySelector(".capchk");if(c){const d=document.createElement("div");d.innerHTML=capChecks(t.value);c.replaceWith(d.firstElementChild)}});

</script>

<script>

/* ============ Mejoras (tanda 5, inspiradas en Later, Planoly, Plann, SocialPilot y Metricool) ============ */
/* --- Bloques guardados: conjuntos de hashtags y textos que se insertan con un toque --- */
const BLOQUES_BASE=[{n:"Serie del Código",t:"#ClausulaLegal #CodigoCivil #Contratos #DerechoArgentino",h:true},{n:"Alquileres",t:"#Alquileres #Inquilinos #Propietarios #ContratoDeAlquiler",h:true},
  {n:"Aclaración legal",t:"Contenido informativo: no reemplaza el asesoramiento de un abogado matriculado.",h:false},{n:"Llamada a la acción",t:"¿Te pasó algo así? Contalo en comentarios 👇 Guardalo y compartilo con quien lo necesite.",h:false}];

function bloquesBar(target){return `<div class="blqbar"><span class="small muted">Insertar:</span>${bloques().map((b,i)=>`<button class="fchip" data-blq="${i}" data-target="${esc(target)}" title="${esc(b.t)}">${b.h?"# ":""}${esc(b.n)}</button>`).join("")}</div>`}
function insertarBloque(ta,b){let v=ta.value.trimEnd();if(b.h){const have=new Set((v.match(/#[\wáéíóúñü]+/gi)||[]).map(x=>x.toLowerCase()));const add=b.t.split(/\s+/).filter(x=>!have.has(x.toLowerCase()));if(!add.length){toast("Esos hashtags ya están");return}
    v=/(^|\n)#\S+(\s+#\S+)*$/.test(v)?v+" "+add.join(" "):v+"\n\n"+add.join(" ")}
  else{if(v.includes(b.t)){toast("Ese texto ya está");return}const m=v.match(/\n\n(#\S+(\s+#\S+)*)$/);v=m?v.slice(0,m.index)+"\n\n"+b.t+m[0]:v+"\n\n"+b.t}
  ta.value=v;ta.dispatchEvent(new Event("input",{bubbles:true}));toast("Insertado: "+b.n)}
document.addEventListener("click",async e=>{const el=e.target.closest("[data-blq]");if(!el)return;const ta=document.getElementById(el.dataset.target);const b=bloques()[+el.dataset.blq];if(!ta||!b)return;insertarBloque(ta,b);
  if(ta.id.startsWith("cap-")){const v=ta.value;const i=v.lastIndexOf("\n\n#");try{await salaSet(ta.id.slice(4),{caption:i>=0?v.slice(0,i):v,hashtags:i>=0?v.slice(i+2):""})}catch(_){}}});

/* --- Primer comentario y horario sugerido en la Sala --- */
const _salaStepsE=salaSteps;salaSteps=r=>{let h=_salaStepsE(r);const id=esc(r.id);
  h=h.replace(/(<textarea id="cap-[^"]+"[^>]*>[\s\S]*?<\/textarea>)/,`$1${bloquesBar("cap-"+r.id)}`);
  h=h.replace(`<li><b>Bajá el video</b>`,`<li><b>Primer comentario (opcional)</b><span class="small muted">Sirve para sumar un dato extra o la fuente sin alargar la descripción. Si programás con Metricool, se publica solo.</span><textarea id="fc-${id}" rows="3" placeholder="Ej.: 📚 Fuente: art. 1059 del Código Civil y Comercial (texto vigente en InfoLEG).">${esc(r.primerComentario||"")}</textarea><div class="btns"><button class="btn sm" data-fcsave="${id}">Guardar</button><button class="btn sm" data-fccopy="${id}">Copiar</button></div></li><li><b>Bajá el video</b>`);
  h=h.replace(/(<input type="datetime-local" id="when-[^"]+"[^>]*>)/,`$1<button class="btn sm" data-besttime="${id}" ${S.caps.mcp==="ok"?"":"disabled"}>Sugerir horario según tu audiencia</button><span class="small muted" id="bt-${id}"></span>`);
  return h};
document.addEventListener("click",async e=>{const el=e.target.closest("[data-fcsave],[data-fccopy],[data-besttime]");if(!el)return;
  if(el.dataset.fcsave){const id=el.dataset.fcsave;try{await salaSet(id,{primerComentario:$("#fc-"+CSS.escape(id)).value.trim()});toast("Primer comentario guardado")}catch(_){}}
  if(el.dataset.fccopy){try{await navigator.clipboard.writeText($("#fc-"+CSS.escape(el.dataset.fccopy)).value);toast("Copiado: pegalo como primer comentario apenas publiques")}catch(_){toast("Seleccioná el texto y copialo a mano")}}
  if(el.dataset.besttime){const id=el.dataset.besttime;const out=$("#bt-"+CSS.escape(id));if(!mcp){toast("Metricool no está disponible");return}out.textContent="Consultando Metricool…";
    try{const from=todayAR(),to=fmtAR.format(new Date(Date.now()+6*864e5)).slice(0,10);
      const r=await mcp.callTool(MC,"getBestTimeToPostByNetwork",{brandId:String(S.settings.brandId),fromDate:from+"T00:00:00-03:00",toDate:to+"T23:59:59-03:00",timezone:TZ,socialNetwork:"instagram"});
      const slots=[];arr(r.payload?.data).forEach(d=>arr(d.bestTimesByHour).forEach(h=>slots.push({dow:+d.dayOfWeek,h:+h.hourOfDay,v:+h.value||0})));
      const top=slots.filter(s=>s.v>0).sort((a,b)=>b.v-a.v);if(!top.length){out.textContent="Metricool todavía no tiene datos suficientes de tu audiencia.";return}
      const now=Date.now()+3600e3;let pick=null;
      for(const s of top){for(let k=0;k<7&&!pick;k++){const d=fmtAR.format(new Date(Date.now()+k*864e5)).slice(0,10);const dow=((new Date(d+"T12:00:00-03:00").getUTCDay()+6)%7)+1;const iso=d+"T"+String(s.h).padStart(2,"0")+":00";
        if(dow===s.dow&&Date.parse(iso+":00-03:00")>now)pick=iso}if(pick)break}
      if(!pick){out.textContent="No encontré un horario fuerte en los próximos 7 días.";return}
      $("#when-"+CSS.escape(id)).value=pick;out.textContent="Sugerido: "+niceDate(pick)+" (de los horarios con más actividad según Metricool). Revisalo antes de programar."}
    catch(err){out.textContent="Metricool no respondió. Elegí el horario a mano."}}});
/* el primer comentario viaja con la programación (sigue pidiendo tu confirmación como antes) */
const _salaScheduleE=salaSchedule;salaSchedule=async r=>{if(r){const fc=$("#fc-"+CSS.escape(r.id));if(fc&&fc.value.trim()!==(r.primerComentario||""))await salaSet(r.id,{primerComentario:fc.value.trim()});r={...r,primerComentario:fc?fc.value.trim():r.primerComentario}}
  const orig=mcp.callTool.bind(mcp);mcp.callTool=(srv,tool,args)=>{if(tool==="createScheduledPost"&&r&&r.primerComentario){try{const info=JSON.parse(args.info);info.firstCommentText=r.primerComentario;args={...args,info:JSON.stringify(info)}}catch(_){}}return orig(srv,tool,args)};
  try{return await _salaScheduleE(r)}finally{mcp.callTool=orig}};

/* --- Planificador visual: reordenar lo que todavía no se publicó --- */
const _gridItemsE=gridItems;gridItems=()=>{const it=_gridItemsE();it.forEach(x=>{const m=x.attr.match(/data-id="([^"]+)"/);x.id=m&&m[1];x.col=x.k==="Reel"?"reels":"posts";const src=(x.col==="reels"?S.reels:S.posts).find(o=>esc(o.id)===x.id);x.gp=src&&src.gridPos});
  const pend=it.filter(x=>x.st!=="publicado"),pub=it.filter(x=>x.st==="publicado");pend.sort((a,b)=>(b.gp??b.ts)-(a.gp??a.ts));return[...pend,...pub]};
gridPreview=()=>{const it=gridItems();if(!it.length)return"";let pi=-1;
  const tiles=it.map(x=>{const tile=`<button class="igt" ${x.attr} aria-label="${esc(x.k+": "+x.t)}">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:`<span class="igph"><b>${esc(x.t)}</b></span>`}<span class="igk">${esc(x.k)}${x.st==="publicado"?"":" · "+esc(x.st==="programado"?"programada":x.st==="aprobado"?"aprobada":"en revisión")}</span></button>`;
    if(x.st==="publicado")return tile;pi++;return `<div class="igwrap">${tile}<span class="igmv"><button data-gmv="-1" data-gi="${pi}" aria-label="Mover antes">◀</button><button data-gmv="1" data-gi="${pi}" aria-label="Mover después">▶</button></span></div>`}).join("");
  return `<section class="panel"><h2>Así se ve tu perfil</h2><span class="small muted" style="margin-top:-6px">Lo pendiente arriba, lo publicado abajo · la pieza más nueva va arriba a la izquierda</span>
  <div class="iggrid">${tiles}</div><p class="small muted" style="margin:0">Usá ◀ ▶ para probar el orden de lo que todavía no salió. Instagram recorta las portadas en la grilla: mantené títulos y caras en el centro.</p></section>`};
document.addEventListener("click",async e=>{const el=e.target.closest("[data-gmv]");if(!el)return;e.stopPropagation();const pend=gridItems().filter(x=>x.st!=="publicado");const i=+el.dataset.gi,j=i+ +el.dataset.gmv;if(j<0||j>=pend.length)return;
  const a=pend[i],b=pend[j];const ga=a.gp??a.ts,gb=b.gp??b.ts;const na=gb,nb=ga===gb?ga+(+el.dataset.gmv>0?1:-1):ga;
  const raw=x=>(x.col==="reels"?S.reels:S.posts).find(o=>esc(o.id)===x.id)?.id;
  try{await dbUpdate(a.col+"/"+raw(a),{gridPos:na});await dbUpdate(b.col+"/"+raw(b),{gridPos:nb});toast("Orden de la grilla actualizado")}catch(_){}},true);

/* --- Ajustes: administrar los bloques guardados --- */
const _vConfigE=vConfig;vConfig=()=>{const h=_vConfigE();const add=`<section class="panel"><h2>Bloques guardados</h2><p class="small muted" style="margin:0">Conjuntos de hashtags y textos fijos que insertás con un toque en la Sala.</p>
  <div class="list">${bloques().map((b,i)=>`<div class="row"><span><b>${b.h?"# ":""}${esc(b.n)}</b><span class="s" style="display:block">${esc(b.t)}</span></span><button class="link" data-blqdel="${i}">Quitar</button></div>`).join("")}</div>
  <div class="fields"><label for="bqN">Nombre<input id="bqN" placeholder="Ej.: Contratos"></label><label for="bqT">Texto o hashtags<input id="bqT" placeholder="#Contratos #Firmas"></label></div><button class="btn sm" data-blqadd="1" style="align-self:flex-start">Agregar bloque</button></section>`;
  const j=h.lastIndexOf("</div>");return j<0?h+add:h.slice(0,j)+add+h.slice(j)};
document.addEventListener("click",async e=>{const el=e.target.closest("[data-blqadd],[data-blqdel]");if(!el)return;const list=[...bloques()];
  if(el.dataset.blqadd){const n=$("#bqN").value.trim(),t=$("#bqT").value.trim();if(!n||!t){toast("Completá nombre y texto");return}list.push({n,t,h:/^#/.test(t)})}else list.splice(+el.dataset.blqdel,1);
  try{await saveSettings({bloques:list});toast("Bloques guardados");render()}catch(_){}});

render();
</script>
